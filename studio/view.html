<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>슬라이드 보기</title>
<link rel="icon" href="data:,">
<!-- 보기 전용 공유 링크 페이지: 허브가 /s/<토큰>/ 에 이 파일을 내준다(engine-request #2, docs/auth.md 공유 링크).
     전체 화면 슬라이드 넘기기(키보드·터치·쪽 번호)만 - 노트·편집 UI 없음. 덱은 /s/<토큰>/api/deck/<덱>(허브가 노트·숨김 장을 걸러 낸 것).
     비밀번호 링크면 먼저 입력 화면(/api/share/state · /api/share/auth → 쿠키 nexa_share). 모든 경로는 이 페이지 주소(/s/<토큰>/) 기준 상대 경로. -->
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 14px/1.5 "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; overflow: hidden; touch-action: none; }
  #stage { position: fixed; inset: 0; }
  #st { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; background: #fff; }
  #st .rs-el[data-link], #st .rs-a { cursor: pointer; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, rgba(0,0,0,.6)); opacity: 0; transition: opacity .2s; }
  body.ui #bar, body:hover #bar { opacity: 1; }
  #bar button { background: rgba(255,255,255,.14); color: #eee; border: 0; border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
  #bar button:hover { background: rgba(255,255,255,.26); }
  #bar button:disabled { opacity: .35; cursor: default; }
  #title { flex: 1; color: #ccc; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pos { font: 13px Consolas, monospace; color: #ddd; min-width: 64px; text-align: center; }
  #hint { position: fixed; left: 12px; top: 10px; font-size: 12px; color: #999; opacity: 0; transition: opacity .3s; pointer-events: none; }
  body.ui #hint { opacity: 1; }
  #gate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #111; z-index: 5; }
  #gate.show { display: flex; }
  #gate form { background: #262626; border-radius: 16px; padding: 28px 26px; width: min(380px, 92vw); display: grid; gap: 10px; }
  #gate h1 { font-size: 18px; margin: 0 0 4px; }
  #gate p { margin: 0; color: #aaa; font-size: 13px; }
  #gate input { font: inherit; padding: 9px 12px; border-radius: 9px; border: 1px solid #444; background: #1a1a1a; color: #eee; }
  #gate button { font: inherit; font-weight: 700; padding: 9px 12px; border-radius: 9px; border: 0; background: #A91F24; color: #fff; cursor: pointer; }
  #gate .err { color: #FF8A80; font-size: 12.5px; min-height: 1.2em; }
  #msg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #bbb; font-size: 15px; text-align: center; padding: 20px; }
  #msg.show { display: flex; }
</style>
<style id="fonts-css"></style>
<style id="rs-css"></style>
</head>
<body class="ui">
<div id="msg"></div>
<div id="gate"><form id="gateForm"><h1>비밀번호가 필요한 공유 링크</h1><p>이 슬라이드를 보려면 보낸 사람에게 받은 비밀번호를 넣어 주세요.</p>
  <input id="pw" type="password" autocomplete="off" placeholder="비밀번호" required autofocus><button type="submit">열기</button><div class="err" id="gateErr"></div></form></div>
<div id="stage"><div id="st"></div></div>
<div id="hint">← → 넘기기 · Home/End · F 전체 화면</div>
<div id="bar"><button id="prev" title="이전 (←)">◀</button><span id="pos"></span><button id="next" title="다음 (→)">▶</button><span id="title"></span><button id="full" title="전체 화면 (F)">⛶</button></div>
<script src="studio/i18n/en.js"></script>
<script src="studio/i18n/en.pages.js"></script>
<script src="studio/i18n.js"></script>
<script src="studio/render.js"></script>
<script>
(async () => {
  const $ = (s) => document.querySelector(s);
  const BASE = location.pathname.replace(/\/$/, "");  // /s/<토큰>
  window.RENDER_BASE = BASE + "/";  // 그림 src 는 이 접두 아래(허브가 덱이 참조하는 파일만 중계한다)
  const say = (t) => { const m = $("#msg"); m.textContent = t; m.classList.add("show"); };
  const jget = async (u) => { const r = await fetch(u, { cache: "no-store" }); let d = null; try { d = await r.json(); } catch (e) { /* 본문 없음 */ } return { ok: r.ok, status: r.status, data: d }; };
  const st = await jget("api/share/state");
  if (!st.ok || !st.data) { say(I18N.t("이 링크는 열 수 없습니다")); return; }
  if (st.data.needPassword) {
    await new Promise((done) => {
      const g = $("#gate"); g.classList.add("show");
      if (st.data.locked) $("#gateErr").textContent = I18N.t("실패가 잦아 잠시 잠겼습니다 - 몇 분 뒤에 다시");
      $("#gateForm").addEventListener("submit", async (e) => {
        e.preventDefault(); $("#gateErr").textContent = "";
        const r = await fetch("api/share/auth", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("#pw").value }) });
        let d = null; try { d = await r.json(); } catch (err) { /* 본문 없음 */ }
        if (r.ok) { g.classList.remove("show"); done(); return; }
        $("#gateErr").textContent = r.status === 429 ? I18N.t("실패가 잦아 잠시 잠겼습니다 - 몇 분 뒤에 다시") : I18N.t("비밀번호가 맞지 않습니다");
        $("#pw").select();
      });
      setTimeout(() => $("#pw").focus(), 50);
    });
  }
  // 글꼴: fonts.css 의 절대 경로(/api/fontfile/…)를 이 링크 접두 아래로 - 허브로 새지 않게(작업 공간 글꼴 api/fontcss 는 서버가 접두를 붙인다)
  try { const css = await (await fetch("studio/fonts.css")).text(); $("#fonts-css").textContent = css.replace(/url\("\/api\/fontfile\//g, `url("${BASE}/api/fontfile/`); } catch (e) { /* 없으면 대체 글꼴 */ }
  const wf = document.createElement("link"); wf.rel = "stylesheet"; wf.href = "api/fontcss"; document.head.appendChild(wf);  // 작업 공간 fonts/ - 비밀번호 확인 뒤에 읽는다(그 전엔 401)
  const [tok, dk] = await Promise.all([jget("studio/tokens.json"), jget("api/deck/" + encodeURIComponent(st.data.deck))]);
  if (!tok.ok || !dk.ok || !dk.data || !Array.isArray(dk.data.slides)) { say(I18N.t("슬라이드를 읽지 못했습니다")); return; }
  const deck = dk.data;
  Render.setTokens(tok.data); Render.setLazy(false);
  try { const l = await jget("studio/code_langs.json"); if (l.ok) Render.setLangs(l.data); } catch (e) { /* 없으면 SQL 만 */ }
  Render.setDeckFonts && Render.setDeckFonts(deck.fontPreset);
  $("#rs-css").textContent = Render.css();
  document.title = `${deck.title || I18N.t("슬라이드 보기")}`;
  $("#title").textContent = deck.title || "";
  const N = deck.slides.length;
  if (!N) { say(I18N.t("보여 줄 슬라이드가 없습니다")); return; }
  let idx = Math.max(0, Math.min(N - 1, (parseInt((location.hash || "").slice(1), 10) || 1) - 1));
  function fit() { const k = Math.min(innerWidth / 1280, innerHeight / 720), s = $("#st"); s.style.transform = `scale(${k})`; s.style.left = (innerWidth - 1280 * k) / 2 + "px"; s.style.top = (innerHeight - 720 * k) / 2 + "px"; }
  function render() {
    const s = deck.slides[idx];
    $("#st").innerHTML = Render.renderSlide(s, s.page || idx + 1);
    $("#pos").textContent = `${idx + 1} / ${N}`;
    $("#prev").disabled = idx === 0; $("#next").disabled = idx === N - 1;
    if (location.hash !== `#${idx + 1}`) history.replaceState(null, "", `#${idx + 1}`);
    fit(); showUi();
  }
  function go(d) { const n = Math.max(0, Math.min(N - 1, idx + d)); if (n !== idx) { idx = n; render(); } }
  let uiT = 0;
  function showUi() { document.body.classList.add("ui"); clearTimeout(uiT); uiT = setTimeout(() => document.body.classList.remove("ui"), 2500); }
  function follow(v) {  // 요소 링크 - "#3" 은 3번 장(원래 번호), 그 밖은 새 탭
    if (!v) return false;
    if (v.startsWith("#")) { const key = v.slice(1); const n = /^\d+$/.test(key) ? deck.slides.findIndex((s) => (s.page || 0) === +key) : deck.slides.findIndex((s) => s.id === key); if (n >= 0) { idx = n; render(); } return true; }
    window.open(v, "_blank", "noopener"); return true;
  }
  $("#prev").onclick = () => go(-1); $("#next").onclick = () => go(1);
  $("#full").onclick = () => { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); };
  $("#stage").addEventListener("click", (e) => { const ln = e.target.closest("[data-link]"); if (ln && follow(ln.dataset.link)) return; go(e.clientX < innerWidth / 3 ? -1 : 1); });
  document.addEventListener("keydown", (e) => {
    const k = e.key;
    if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(k)) go(1);
    else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(k)) go(-1);
    else if (k === "Home") { idx = 0; render(); } else if (k === "End") { idx = N - 1; render(); }
    else if (k.toLowerCase() === "f") $("#full").onclick();
    else return;
    e.preventDefault();
  });
  let tx = null, ty = null;  // 터치 - 가로로 40px 이상 밀면 넘긴다
  document.addEventListener("touchstart", (e) => { if (e.touches.length === 1) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; } }, { passive: true });
  document.addEventListener("touchend", (e) => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = ty = null; if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1); else showUi(); }, { passive: true });
  document.addEventListener("mousemove", showUi);
  addEventListener("resize", fit);
  addEventListener("hashchange", () => { const n = parseInt(location.hash.slice(1), 10); if (n >= 1 && n <= N && n - 1 !== idx) { idx = n - 1; render(); } });
  render();
  await document.fonts.ready;
  document.body.dataset.ready = "1";
})();
</script>
</body>
</html>
