<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #ECEAEA; color: var(--on-surface); font-family: var(--font); }
  /* ---------- 페이지 도구 ---------- */
  .bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 24px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .bar h1 { font-size: 17px; margin: 0 16px 0 0; }
  .grp { display: flex; gap: 6px; align-items: center; }
  .grp span { font-size: 13px; color: var(--on-surface-variant); margin-right: 2px; }
  .bar button { font: inherit; font-size: 13px; padding: 7px 14px; border: 0; background: var(--surface-container); border-radius: var(--r-full); cursor: pointer; }
  .bar button.on { background: var(--primary); color: #fff; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 16px 24px 64px; }
  .note { font-size: 13px; color: var(--on-surface-variant); line-height: 1.6; margin: 4px 0 16px; }
  /* 색 역할 범례 */
  .legend { background: #fff; border-radius: var(--r-m); padding: 18px 20px; margin-bottom: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px 28px; }
  .legend h3 { margin: 0 0 8px; font-size: 14px; }
  .legend .row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 5px 0; }
  .sw { width: 34px; height: 20px; border-radius: 6px; flex: none; }
  .legend small { color: var(--on-surface-variant); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 28px 24px; }
  .grid.one { grid-template-columns: 1fr; }
  .cap { font-size: 13px; margin: 8px 2px 0; }
  .cap b { color: var(--primary); margin-right: 6px; }
  .cap i { display: block; font-style: normal; color: var(--on-surface-variant); font-size: 12px; margin-top: 2px; }
  .frame { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.14); cursor: zoom-in; background: #fff; }
  .grid.one .frame { cursor: default; }
  .frame > .slide { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

  /* ---------- 슬라이드 (1280×720) — 가장자리 선·띠 없음 ---------- */
  .slide { width: var(--sw); height: var(--sh); position: relative; overflow: hidden; background: var(--surface); }
  .vT { background: var(--surface-dim); }
  .a { position: absolute; }
  .card { background: var(--surface-container); border-radius: var(--r-m); }
  .vT .card { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 1px 3px 1px rgba(0,0,0,.04); }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 14px; border-radius: var(--r-full); font-size: 14px; font-weight: 600; white-space: nowrap; }

  .pill.out { background: transparent; box-shadow: inset 0 0 0 1.5px var(--outline-variant); color: var(--on-surface-variant); font-weight: 500; }

  .wm { position: absolute; bottom: 30px; right: 112px; height: 12px; }
  .pno { position: absolute; bottom: 22px; right: 48px; height: 28px; min-width: 44px; padding: 0 10px; border-radius: var(--r-full); background: var(--surface-container); font-size: 13px; display: flex; align-items: center; justify-content: center; color: var(--on-surface-variant); }

  .kick { position: absolute; left: var(--pad); top: 36px; }
  .title { position: absolute; left: var(--pad); top: 80px; right: 240px; font-size: 34px; font-weight: 700; line-height: 1.25; letter-spacing: -.3px; }
  .sub { position: absolute; left: var(--pad); top: 128px; right: 240px; font-size: 18px; color: var(--on-surface-variant); }
  .body { position: absolute; left: var(--pad); right: var(--pad); top: 184px; bottom: 80px; font-size: 20px; line-height: 1.55; }
  .blist { margin: 0; padding: 0; list-style: none; }

  table.t th:first-child { border-radius: 12px 0 0 12px; } table.t th:last-child { border-radius: 0 12px 12px 0; }
  table.t td { padding: 11px 14px; border-bottom: 1px solid var(--surface-container-high); vertical-align: middle; }

  .cb { background: var(--code-bg); border-radius: var(--r-m); overflow: hidden; font-family: var(--mono); font-size: 15px; line-height: 1.6;
        box-shadow: inset 0 0 0 1px var(--surface-container-high); }
  .cb .ln { display: flex; white-space: pre; }
  .cb .g { flex: none; width: 48px; padding-right: 12px; text-align: right; background: var(--code-gutter-bg); color: var(--code-gutter); user-select: none; }
  .cb .c { flex: 1; padding-left: 14px; color: var(--code-ink); }

  .cb .ln:last-child .g, .cb .ln:last-child .c { padding-bottom: 12px; }
  .k { color: var(--code-kw); font-weight: 700; } .tb { color: var(--code-tbl); } .al { color: var(--code-alias); font-style: italic; }
  .ca { color: var(--code-colalias); font-style: italic; } .st { color: var(--code-str); } .nu { color: var(--code-num); }
  .co { color: var(--code-cm); } .bi { color: var(--code-bind); }
  .plan { font-family: var(--mono); font-size: 14px; line-height: 1.5; white-space: pre; padding: 16px 18px; }
  .hl { background: var(--primary-container); color: var(--primary); font-weight: 700; }  /* 고정폭 강조: 여백·굵기 폭 변화 없이 색만 — 세로줄 정렬 유지 */
  .num { display: inline-flex; width: 28px; height: 28px; border-radius: 50%; color: #fff; font-size: 14px; font-weight: 700; align-items: center; justify-content: center; flex: none; }

<div class="bar">
  <h1>lecture 템플릿 · 디자인 컨셉 v2 (Material)</h1>
  <div class="grp"><span>시안</span><button data-v="vL" class="on">L 라이트 — 흰 바탕 + 톤 카드</button><button data-v="vT">T 톤 표면 — 옅은 바탕 + 흰 카드</button></div>

<p class="note">Material Design 3 방식: 가장자리 선·띠 없이 둥근 카드·알약 모양 칩·색 면(톤)으로 구역을 나눈다. 색은 의미에 묶어 덱 전체에서 반복한다(아래 범례).
 "부 색 미리보기"를 바꾸면 같은 레이아웃이 Day2·Day3 장에서 어떻게 보이는지 확인할 수 있다. 이전 시안은 <a href="concept-v1.html">v1</a>.</p>

<script>
const LOGO = "../../../../example/assets/brand/logo.png", WM = "../../../../example/assets/brand/wordmark.png";
const DAY = { 1: ["Day1 · 설계", "ch00"], 2: ["Day2 · 쿼리와 옵티마이저", "ch04"], 3: ["Day3 · 실무 종합", "ch10"] };
let variant = "vL", day = 1, mode = "grid", cur = 0;
const dv = () => `--dc:var(--day${day});--dcc:var(--day${day}-container);--dco:var(--on-day${day}-container)`;
const P = (bg, fg, t, cls = "") => `<span class="pill ${cls}" style="background:${bg};color:${fg}">${t}</span>`;
const dayPill = (t) => P("var(--dcc)", "var(--dco)", t || `${DAY[day][0]} · ${DAY[day][1]}`);
const REQ = P("var(--primary)", "#fff", "필수", "sm"), ADV = `<span class="pill sm out">심화</span>`;
const THEORY = P("var(--theory-container)", "var(--theory)", "이론", "sm"), LAB = P("var(--lab-container)", "var(--lab)", "실습", "sm");
const head = (t, s, k) => `<div class="kick">${k || dayPill()}</div><div class="title">${t}</div>${s ? `<div class="sub">${s}</div>` : ""}<img class="logo" src="${LOGO}" alt="logo">`;
const foot = (n, c) => `<div class="crumb">${c}</div><img class="wm" src="${WM}" alt=""><div class="pno">${n}</div>`;
const STEP = ["①", "②", "③", "④", "⑤", "⑥", "⑦"];
const sc = (i) => `var(--s${i + 1})`;


/* ---------- SQL 색 입히기(DBeaver 라이트 근사) + 줄 번호 ---------- */
const KW = new Set(("select from where and or not in exists join left right full outer inner cross on as group by order having union all with recursive "+
  "case when then else end between like is null distinct insert into values update set delete merge using matched connect prior start table desc asc over "+
  "partition fetch first rows only create index primary key foreign references constraint default level nocycle siblings search depth breadth cycle to").split(" "));
const TYPE = new Set("varchar varchar2 number date text char integer int timestamp clob blob boolean".split(" "));
const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function hlSQL(src) {
  const re = /(--[^\n]*|\/\*[\s\S]*?\*\/)|('(?:[^']|'')*')|(:[A-Za-z_]\w*)|(\b\d+(?:\.\d+)?\b)|("[^"]+"|[A-Za-z_][\w$#]*)|(\s+|[^\s])/g;
  const toks = []; let m;
  while ((m = re.exec(src))) toks.push(m[1] ? ["co", m[0]] : m[2] ? ["st", m[0]] : m[3] ? ["bi", m[0]] : m[4] ? ["nu", m[0]] : m[5] ? ["id", m[0]] : ["p", m[0]]);
  const tables = new Set(), aliases = new Set(); let prevKw = "", expectAlias = false;
  const next = (i) => { for (let j = i + 1; j < toks.length; j++) if (!/^\s+$/.test(toks[j][1])) return toks[j]; return null; };
  const wrap = (c, v) => `<span class="${c}">${esc(v)}</span>`;
  const pass = () => { prevKw = ""; expectAlias = false; return toks.map(([t, v], i) => {
    if (t !== "id") {
      if (!(t === "p" && (/^\s+$/.test(v) || v === "."))) expectAlias = false;
      if (t === "p" && v === ",") prevKw = prevKw === "_t" ? "from" : prevKw;
      return t === "p" ? esc(v) : wrap(t, v);
    }
    const low = v.toLowerCase(), nx = next(i);
    if (TYPE.has(low)) { prevKw = low; return wrap("k", v); }
    if (KW.has(low)) { if (low !== "recursive") prevKw = low; expectAlias = false; return wrap("k", v); }
    if (nx && nx[1] === "(" && !["with", "_t"].includes(prevKw)) { prevKw = ""; return wrap("k", v); }
    if (nx && nx[1] === ".") return wrap(aliases.has(low) ? "al" : "tb", v);
    if (["from", "join", "into", "update", "with", "table", "using", "merge"].includes(prevKw)) { tables.add(low); prevKw = "_t"; expectAlias = true; return wrap("tb", v); }
    if (expectAlias && prevKw === "_t") { aliases.add(low); expectAlias = false; prevKw = ""; return wrap("al", v); }
    if (prevKw === "as") { prevKw = ""; return wrap(tables.has(low) ? "tb" : "ca", v); }
    if (tables.has(low)) return wrap("tb", v);
    if (aliases.has(low)) return wrap("al", v);
    prevKw = ""; return esc(v);
  }).join(""); };
  pass();                     // 1차: 테이블·별칭 수집(선언 전에 쓰인 별칭도 맞게 칠하기 위해)
  return pass().split("\n");  // 2차: 색 입히기
}
/* codeBlock(src, {start, focus:[줄 번호], show:[[from,to]]}) — show를 주면 그 구간만 보이고 사이는 ⋮로 생략 */
function codeBlock(src, o = {}) {
  const start = o.start || 1, lines = hlSQL(src), focus = new Set(o.focus || []);
  const vis = (n) => !o.show || o.show.some(([a, b]) => n >= a && n <= b);
  let html = "", gap = false;
  lines.forEach((l, i) => { const n = start + i;
    if (!vis(n)) { if (!gap) { html += `<div class="ln el"><span class="g">⋮</span><span class="c"> </span></div>`; gap = true; } return; }
    gap = false; html += `<div class="ln${focus.has(n) ? " f" : ""}"><span class="g">${n}</span><span class="c">${l || " "}</span></div>`; });
  return `<div class="cb" style="${o.style || ""}">${html}</div>`;
}
const SQL_09 = `SELECT /*+ GATHER_PLAN_STATISTICS */
       d.item_cd, SUM(d.qty) AS dmd_sum
FROM   trx_demand d
WHERE  d.tenant_id = :t
AND    d.period_id BETWEEN :p1 AND :p2
GROUP BY d.item_cd;

SELECT * FROM TABLE(DBMS_XPLAN.DISPLAY_CURSOR(
         NULL, NULL, 'ALLSTATS LAST'));`;
const SQL_BOM = `-- 실습 09-03 BOM 전개: 완제품 1개당 원자재 소요량
WITH recursive_bom (lvl, root_cd, item_cd, qty_path) AS (
    SELECT 1                   AS lvl
         , b.parent_item_cd    AS root_cd
         , b.child_item_cd     AS item_cd
         , b.qty_per           AS qty_path
    FROM   mst_bom b
    WHERE  b.tenant_id = :t
    AND    b.parent_item_cd IN (SELECT i.item_cd
                                FROM   mst_item i
                                WHERE  i.tenant_id = :t
                                AND    i.item_type = 'FG')
    UNION ALL
    SELECT r.lvl + 1
         , r.root_cd
         , b.child_item_cd
         , r.qty_path * b.qty_per
    FROM   recursive_bom r
    JOIN   mst_bom b
      ON   b.tenant_id      = :t
     AND   b.parent_item_cd = r.item_cd
    WHERE  r.lvl < 10
)
CYCLE item_cd SET is_cycle TO 'Y' DEFAULT 'N'
SELECT r.root_cd
     , r.item_cd
     , i.item_nm
     , SUM(r.qty_path)       AS qty_per_fg
FROM   recursive_bom r
JOIN   mst_item i
  ON   i.tenant_id = :t
 AND   i.item_cd   = r.item_cd
WHERE  i.item_type = 'RAW'
GROUP BY r.root_cd, r.item_cd, i.item_nm
ORDER BY r.root_cd, r.item_cd;`;

const S = [
 { name: "① 표지", how: "둥근 사각형(색 면) + 텍스트 + 로고. 가장자리 띠 없음",
   html: () => `<div class="a card" style="left:40px;top:40px;width:760px;height:640px;border-radius:var(--r-l);background:var(--primary-container);box-shadow:none"></div>
   <div class="a" style="left:88px;top:92px">${P("#fff", "var(--primary)", "강의 교재")}</div>
   <div class="a" style="left:88px;top:170px;width:680px;font-size:60px;font-weight:800;line-height:1.15;letter-spacing:-1px;color:var(--on-primary-container)">튜닝이 필요 없는<br>설계와 SQL</div>
   <div class="a" style="left:88px;top:352px;width:660px;font-size:22px;line-height:1.5;color:var(--on-primary-container)">Oracle AI Database 26ai 기준<br>SQL Server · PostgreSQL 대응</div>
   <div class="a" style="left:88px;top:560px;display:flex;gap:8px">${P("var(--day1-container)", "var(--on-day1-container)", "Day1 설계")}${P("var(--day2-container)", "var(--on-day2-container)", "Day2 쿼리")}${P("var(--day3-container)", "var(--on-day3-container)", "Day3 실무")}</div>
   <img class="a" src="${LOGO}" style="left:864px;top:96px;height:88px" alt="logo">
   <div class="a" style="left:864px;top:470px;font-size:16px;line-height:1.9;color:var(--on-surface-variant)">작성 부서<br>장 제목<br>v0.1</div>` },

 { name: "② 목차", how: "부별 카드 3개(부 색 머리 칩) + 장 번호 칩. 부 색이 장 표지·절 칩과 같다",
   html: () => `${head("목차", "3일 과정 · 24장 + 부록", P("var(--surface-container)", "var(--on-surface-variant)", "전체"))}
   ${[[1, "Day1 설계", ["ch00 방법론·과정의 지도", "ch18 데이터 모델링", "ch01 관계형 모델·정규화", "ch02 물리 설계", "ch19 저장 구조 이론", "ch03 저장 구조·인덱스", "ch21 데이터 거버넌스"]],
       [2, "Day2 쿼리와 옵티마이저", ["ch04 실행 원리·실행계획", "ch14 측정과 진단", "ch05 조인·서브쿼리", "ch06 조건 작성·NULL", "ch07 쿼리 변환", "ch23 함수·뷰 성능", "ch12 통계", "ch13 실행계획 제어"]],
       [3, "Day3 실무 종합", ["ch08 분석함수", "ch09 계층·재귀·PIVOT", "ch10 대량 DML·배치", "ch22 제약·트리거", "ch15 동시성", "ch17 Python", "ch11 집계·보고서", "ch20 대용량 관리"]]]
     .map(([d, t, cs], i) => `<div class="a card" style="left:${64 + i * 392}px;top:176px;width:368px;height:470px;padding:18px 20px">
       ${P(`var(--day${d}-container)`, `var(--on-day${d}-container)`, t)}
       <div style="margin-top:12px">${cs.map(x => `<div style="display:flex;align-items:center;gap:10px;padding:6px 0;font-size:16px"><span class="pill sm" style="background:var(--day${d});color:#fff;font-family:var(--mono);min-width:54px;justify-content:center">${x.slice(0, 4)}</span>${x.slice(5)}</div>`).join("")}</div></div>`).join("")}
   ${foot(2, "목차")}` },

 { name: "③ 개정 내역", how: "표(머리 행은 둥근 톤 면, 세로선 없음) + 안내 카드",
   html: () => `${head("개정 내역", "", P("var(--surface-container)", "var(--on-surface-variant)", "전체"))}
   <div class="body" style="--dcc:var(--surface-container-high);--dco:var(--on-surface)"><table class="t">
     <tr><th style="width:110px">버전</th><th style="width:150px">일자</th><th>내용</th><th style="width:160px">작성·검토</th></tr>
     <tr><td>${P("var(--primary)", "#fff", "v0.1", "sm")}</td><td>2026-09-29</td><td>초안 — ch00 방법론·요청 한 번의 여정·과정의 지도</td><td>교육 TF</td></tr>
     <tr><td><span class="pill sm out">v0.2</span></td><td>—</td><td>검토 의견 반영, 실습 수치 실측(26ai 교육 컨테이너)</td><td>—</td></tr>
     <tr><td><span class="pill sm out">v1.0</span></td><td>—</td><td>1차 완성본</td><td>—</td></tr></table>

   <div><h3>부(Day) — 부 안의 모든 장·절·목차에 반복</h3>${row("var(--day1)", "Day1 설계", "청록")}${row("var(--day2)", "Day2 쿼리와 옵티마이저", "청색")}${row("var(--day3)", "Day3 실무 종합", "보라")}${row("var(--apx)", "부록", "회색")}</div>
   <div><h3>절 성격</h3>${row("var(--theory-container)", "이론", "황색 칩")}${row("var(--lab-container)", "실습 · 개선(After)", "녹색")}${row("var(--surface-container)", "대응 박스 · 보조", "중립 회색")}</div>
   <div><h3>순서(단계) — 도식·표·범례에 같은 순서로</h3><div class="row">${STEP.map((s, i) => `<span class="num" style="background:${sc(i)}">${s}</span>`).join("")}</div><small>요청 한 번의 여정 ①~⑦ 등 순서가 있는 항목</small></div>`;
}
const grid = document.getElementById("grid");
function render() {
  grid.className = "grid" + (mode === "one" ? " one" : "");
  const list = mode === "one" ? [[S[cur], cur]] : S.map((s, i) => [s, i]);
  grid.innerHTML = list.map(([s, i]) => `<div><div class="frame" data-i="${i}"><div class="slide ${variant}" style="${dv()}">${s.html()}</div></div>
    <div class="cap"><b>${s.name}</b>${mode === "one" ? `(${cur + 1}/${S.length})` : ""}<i>PPT 재현: ${s.how}</i></div></div>`).join("");
  fit();
}
function fit() { document.querySelectorAll(".frame").forEach(f => f.firstElementChild.style.transform = `scale(${f.clientWidth / 1280})`); }
const sel = (attr, val) => document.querySelectorAll(`[${attr}]`).forEach(x => x.classList.toggle("on", x.getAttribute(attr) === String(val)));
document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { variant = b.dataset.v; sel("data-v", variant); render(); });
document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { day = +b.dataset.d; sel("data-d", day); render(); });
document.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { mode = b.dataset.g; sel("data-g", mode); render(); });
grid.addEventListener("click", e => { const f = e.target.closest(".frame"); if (f && mode === "grid") { cur = +f.dataset.i; mode = "one"; sel("data-g", "one"); render(); } });
addEventListener("keydown", e => { if (mode !== "one") return; if (e.key === "ArrowRight") cur = (cur + 1) % S.length; else if (e.key === "ArrowLeft") cur = (cur - 1 + S.length) % S.length; else if (e.key === "Escape") { mode = "grid"; sel("data-g", "grid"); } else return; render(); });
addEventListener("resize", fit);
legend(); render();
</script>
</body>
</html>
