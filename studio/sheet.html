<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시트 - nexa-slide</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="nexa-requests.css"><!-- 요청 카드·후속·첨부·기록 창 - 편집기와 같은 규칙 -->
<script src="menu.js"></script>
<script src="sheetnew.js"></script>
<script src="lightbox.js"></script>
<script src="search.js"></script>
<!-- 시트 편집 화면(docs/sheets.md) - 표시 언어(i18n.js)는 싣지 않는다: 셀 글(데이터)까지 사전으로 바뀌기 때문(i18n 은 DOM 글을 통째로 바꾼다) -->
<style>
  :root {
    --p: #A91F24; --pc: #FFDAD6; --onpc: #410004;
    --bg: #F4F1F1; --card: #FFFFFF; --tone: #F2EFEF; --tone2: #ECE8E8; --ink: #1F1B1B; --ink2: #534343; --line: #D8C2C0;
    --ok: #146C2E; --okc: #C4EED0; --warnc: #FFDEA6; --warn: #7D5700; --info: #0B4A9E; --infoc: #D6E3FF; --err: #BA1A1A;
    --r: 16px; --font: "Malgun Gothic", "맑은 고딕", sans-serif;
    --sh1: 0 1px 2px rgba(0,0,0,.08); --sh2: 0 6px 24px rgba(0,0,0,.16);
    --grid: #E1DCDC; --hd: #F5F2F2; --hdOn: #FFDAD6; --sel: #1A73E8; --selFill: rgba(26,115,232,.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--font); display: flex; flex-direction: column; overflow: hidden; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .chip { border: 0; background: var(--tone); border-radius: 999px; padding: 6px 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; text-decoration: none; }
  .chip:hover { background: var(--tone2); }
  .chip.primary { background: var(--p); color: #fff; font-weight: 700; }
  .chip.primary:hover { filter: brightness(1.08); }
  .chip.sm { padding: 3px 10px; font-size: 12px; }
  .chip:disabled { opacity: .45; cursor: default; }
  .ib { border: 0; background: none; border-radius: 8px; height: 30px; min-width: 30px; padding: 0 7px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; }
  .ib:hover { background: var(--tone); }
  .ib.on { background: var(--ink); color: #fff; }
  .ib:disabled { opacity: .4; cursor: default; }
  .vsep { width: 1px; align-self: stretch; background: var(--line); margin: 4px 4px; flex: none; }
  /* ---------- 머리줄 ---------- */
  header { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--card); box-shadow: var(--sh1); z-index: 6; min-height: 48px; }
  header h1 { font-size: 14px; margin: 0 4px 0 2px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 32vw; }
  header h1 .k { color: var(--ok); margin-right: 4px; }
  header .sp { flex: 1; }
  #status { min-width: 80px; justify-content: center; }
  #status.saved { background: var(--okc); color: var(--ok); }
  #status.dirty { background: var(--warnc); color: var(--warn); }
  #status.conflict, #status.error { background: var(--pc); color: var(--p); font-weight: 700; }
  #sessChip.on { background: var(--okc); color: var(--ok); }
  #sessChip.busy { background: var(--infoc); color: var(--info); }
  #sessChip.off { background: var(--tone2); color: var(--ink2); }
  #sessChip .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  #sessChip { cursor: pointer; }
  /* 웹 AI 세션 - 시작 창 · 진행 패널 · 턴 로그(wsession.js) - 편집기 index.html 과 같은 규칙 */
  #sessDlg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 110; display: none; align-items: center; justify-content: center; }
  #sessDlg.show { display: flex; }
  #sessDlg .box { background: #fff; border-radius: 18px; padding: 18px 22px; width: min(640px, 94vw); max-height: 86vh; overflow-y: auto; box-shadow: var(--sh2); display: flex; flex-direction: column; gap: 10px; }
  #sessDlg .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #sessDlg label.f { display: block; font-weight: 700; font-size: 12px; margin: 6px 0 3px; }
  #sessDlg select, #sessDlg input[type=text] { font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  #sessDlg .ev { font: 12px Consolas, monospace; background: var(--tone); border-radius: 10px; padding: 8px 10px; max-height: 46vh; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  #sessDlg .ev .e { padding: 1px 0; border-bottom: 1px dashed var(--tone2); }
  #sessDlg .ev .e.err, #sessDlg .ev .e.warn { color: var(--err); }
  #sessDlg .ev .e.turn\.end { color: var(--ok); }
  #sessDlg .hint { color: var(--ink2); font-size: 12px; }
  .menu > div[data-i] .hint { color: var(--ink2); font-size: 12px; }
  .hint { color: var(--ink2); font-size: 12px; }
  .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -1px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  /* ---------- 서식 줄·수식 줄 ---------- */
  #tools { display: flex; align-items: center; gap: 2px; padding: 4px 10px; background: var(--card); border-top: 1px solid var(--tone2); flex-wrap: wrap; }
  #tools select { border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 3px 6px; height: 30px; }
  #tools label.clr { position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; height: 30px; min-width: 30px; border-radius: 8px; cursor: pointer; padding: 0 5px; }
  #tools label.clr:hover { background: var(--tone); }
  #tools label.clr input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
  #tools label.clr .bar { width: 18px; height: 4px; border-radius: 2px; margin-top: -2px; border: 1px solid rgba(0,0,0,.15); }
  #fbar { display: flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--card); border-top: 1px solid var(--tone2); border-bottom: 1px solid var(--line); }
  #nameBox { width: 120px; border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; font: 12px Consolas, monospace; }
  #fbar .fx { color: var(--ink2); font-style: italic; font-weight: 700; padding: 0 4px; }
  #fxIn { flex: 1; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font: 13px Consolas, "Malgun Gothic", monospace; }
  #banner { margin: 6px 10px 0; padding: 8px 14px; border-radius: 12px; background: var(--pc); color: var(--onpc); display: none; align-items: center; gap: 10px; }
  #banner.show { display: flex; }
  #banner .sp { flex: 1; }
  /* ---------- 본문: 격자 + 요청 패널 ---------- */
  main { flex: 1; display: grid; grid-template-columns: 1fr var(--sideW, 340px); min-height: 0; }
  body.noside main { grid-template-columns: 1fr 0; }
  body.noside #side { display: none; }
  #center { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #gridWrap { flex: 1; overflow: auto; background: #fff; position: relative; outline: none; }
  #gridIn { position: relative; width: max-content; }
  #grid { border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 11pt; }
  #grid th { background: var(--hd); color: var(--ink2); font-weight: 400; font-size: 12px; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); position: sticky; user-select: none; padding: 0; }
  #grid thead th { top: 0; z-index: 3; height: 24px; text-align: center; }
  #grid tbody th { left: 0; z-index: 3; text-align: center; }
  #grid thead th.corner { left: 0; z-index: 4; cursor: pointer; }
  #grid th.on { background: var(--hdOn); color: var(--onpc); font-weight: 700; }
  #grid th .rz { position: absolute; right: -3px; top: 0; width: 6px; height: 100%; cursor: col-resize; z-index: 1; }
  #grid tbody th .rz { right: 0; left: 0; top: auto; bottom: -3px; width: 100%; height: 6px; cursor: row-resize; }
  #grid td { border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); padding: 0; background: #fff; overflow: hidden; }
  #grid td.fz { position: sticky; z-index: 1; }
  #grid tr.vsp td { border: 0; background: transparent; }  /* 가상 스크롤 - 그리지 않은 행의 높이만 */
  #grid td.fzr { border-bottom: 2px solid #B9B0B0; }
  #grid td.fzc { border-right: 2px solid #B9B0B0; }
  #grid td .cv { display: flex; align-items: flex-end; padding: 0 4px; overflow: hidden; }
  #grid td .cv > span { white-space: pre; overflow: hidden; text-overflow: clip; min-width: 0; }
  #grid td .cv.wrap > span { white-space: pre-wrap; word-break: break-word; }
  #grid td.err .cv { color: var(--err); }
  #grid.nogrid td { border-color: transparent; }  /* 눈금선 숨김(탭·테마 grid:false) - 테두리(bd)는 칸마다 색을 따로 준다 */
  #draws img.drw { position: absolute; z-index: 1; pointer-events: none; user-select: none; object-fit: contain; }
  #themeChip { cursor: pointer; }
  #grid td { cursor: cell; }
  #addRows { margin: 8px 0 24px 8px; }
  .ov { position: absolute; pointer-events: none; z-index: 2; }
  #selBox { border: 1px solid var(--sel); background: var(--selFill); }
  #curBox { border: 2px solid var(--sel); }
  #fillHandle { position: absolute; z-index: 4; width: 7px; height: 7px; background: var(--sel); border: 1px solid #fff; cursor: crosshair; box-sizing: content-box; }
  #fillBox { border: 1px dashed #444; z-index: 3; }
  #fillBox.shrink { border-style: solid; border-color: #888; background: rgba(0, 0, 0, .12); }
  #fillTip { position: absolute; z-index: 5; pointer-events: none; background: #fff; border: 1px solid #999; border-radius: 3px; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); font: 12px/18px var(--font); padding: 0 6px; white-space: nowrap; }
  #clipBox { border: 2px dashed var(--sel); }
  .reqBox { border: 2px dashed #E0A100; }
  .reqBox.working { border-color: var(--info); }
  .reqBox.draft { border-color: #E5484D; }
  /* 함께 보는 사람(동시 편집 2단계 - nexa-live.js) - 다른 창이 고른 범위 */
  .presBox { border: 2px solid; }
  /* AI 가 바꾼 셀 - 요청이 완료되면 초록 테두리(요청 카드에서 보기·되돌리기) */
  .aiCell { border: 2px solid #16A34A; background: rgba(22, 163, 74, .10); }
  .aiTag { position: absolute; left: -2px; top: 0; transform: translateY(-100%); background: #16A34A; color: #fff; font: 700 10px/15px var(--font); padding: 0 6px; border-radius: 6px 6px 6px 0; white-space: nowrap; }
  #reqList .aichg { display: flex; gap: 6px; align-items: center; margin-top: 6px; padding: 5px 8px; border-radius: 8px; background: #E7F6EC; color: #14532D; font-size: 12px; }
  .presTag { position: absolute; left: -2px; top: 0; transform: translateY(-100%); color: #fff; font: 700 10px/15px var(--font); padding: 0 6px; border-radius: 6px 6px 6px 0; white-space: nowrap; }
  .reqTag { position: absolute; top: 0; right: 0; background: #E0A100; color: #fff; font: 700 10px/15px var(--font); padding: 0 5px; border-radius: 0 0 0 6px; white-space: nowrap; }
  .reqBox.working .reqTag { background: var(--info); }
  .reqBox.draft .reqTag { background: #E5484D; }
  #editor { position: absolute; z-index: 2; border: 2px solid var(--sel); background: #fff; padding: 1px 3px; resize: none; outline: none; overflow: hidden; font: 11pt var(--font); opacity: 0; pointer-events: none; white-space: pre; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  #editor.on { opacity: 1; pointer-events: auto; }
  /* 시트 탭(아래) */
  #tabsRow { display: flex; align-items: stretch; background: var(--card); border-top: 1px solid var(--line); }
  #tabsRow #tabs { flex: 1; min-width: 0; border-top: 0; }
  #sumBar { flex: none; align-self: center; padding: 0 12px; font-size: 12px; color: var(--ink2); white-space: nowrap; cursor: pointer; user-select: none; }
  #sumBar:hover { color: var(--ink); }
  #findBox { position: fixed; top: 96px; right: 380px; z-index: 60; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.14); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
  #findBox[hidden] { display: none; }
  #findBox .row { display: flex; gap: 6px; align-items: center; }
  #findBox input:not([type]) { width: 220px; font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; }
  #findBox .rp { display: none; }
  #findBox.rep .rp { display: flex; }
  #findBox .opt { gap: 10px; color: var(--ink2); }
  #findBox .opt label { display: inline-flex; gap: 3px; align-items: center; }
  #fbMsg { margin-left: auto; color: var(--ink); }
  #grid th.hidN { box-shadow: inset 0 0 0 1px var(--sel); }  /* 옆에 숨긴 행·열 */
  #fltLay .flt { position: absolute; z-index: 3; width: 16px; height: 16px; padding: 0; border: 1px solid var(--line); border-radius: 3px; background: #fff; font-size: 9px; line-height: 14px; cursor: pointer; color: var(--ink2); }
  #fltLay .flt.on { background: var(--sel); color: #fff; border-color: var(--sel); }
  .fltPop { position: fixed; z-index: 80; width: 240px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.16); padding: 6px; font-size: 12.5px; display: flex; flex-direction: column; gap: 2px; }
  .fltPop > button { text-align: left; border: 0; background: none; padding: 4px 6px; border-radius: 6px; cursor: pointer; font: inherit; }
  .fltPop > button:hover { background: var(--tone, #F2EFEF); }
  .fltPop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
  .fltPop .vals { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; }
  .fltPop label { display: flex; gap: 6px; align-items: center; padding: 2px 4px; }
  .fltPop label small { margin-left: auto; color: var(--ink2); }
  .fltPop .acts { display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px; }
  .fltPop .acts button { border: 0; border-radius: 999px; padding: 4px 12px; cursor: pointer; font: inherit; background: var(--tone, #F2EFEF); }
  .fltPop .acts button.primary { background: var(--p, #A91F24); color: #fff; }
  #dvBtn { position: absolute; z-index: 4; width: 18px; height: 18px; padding: 0; border: 1px solid var(--line); border-radius: 3px; background: #fff; font-size: 9px; line-height: 16px; cursor: pointer; color: var(--ink2); }
  #dvBtn[hidden] { display: none; }
  #acBox { position: fixed; z-index: 90; min-width: 260px; max-width: 460px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.16); font-size: 12px; padding: 3px; }
  #acBox[hidden] { display: none; }
  #acBox .it { padding: 3px 8px; border-radius: 5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #acBox .it span, #acBox .hint { color: var(--ink2); }
  #acBox .it.on { background: var(--selFill); }
  #acBox .hint { font-size: 11px; padding: 2px 8px; border-top: 1px solid var(--line); margin-top: 2px; }
  #acBox .sig { padding: 3px 8px; white-space: nowrap; }
  .cfDlg label { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
  .cfDlg label[hidden] { display: none; }
  .cfDlg select, .cfDlg input { font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; width: 170px; }
  #dvLay i { position: absolute; z-index: 2; width: 0; height: 0; border-top: 6px solid #E5484D; border-left: 6px solid transparent; pointer-events: none; }
  #tabs { align-items: center; gap: 2px; padding: 3px 8px; background: var(--card); border-top: 1px solid var(--line); min-height: 34px; overflow-x: auto; }
  #tabs button.t { border: 0; background: none; border-radius: 0 0 8px 8px; padding: 4px 14px; white-space: nowrap; color: var(--ink2); }
  #tabs button.t:hover { background: var(--tone); }
  #tabs button.t.on { background: var(--pc); color: var(--onpc); font-weight: 700; }
  #tabs button.t .n { font-size: 10px; background: #E0A100; color: #fff; border-radius: 8px; padding: 0 5px; margin-left: 5px; }
  #tabs input { width: 120px; padding: 2px 6px; border: 1px solid var(--sel); border-radius: 6px; }
  #tabs .add { font-weight: 700; }
  /* 요청 패널 */
  #side { background: var(--card); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; position: relative; }
  #sideSplit { position: absolute; left: -3px; top: 0; width: 6px; height: 100%; cursor: col-resize; z-index: 3; }
  #side h2 { font-size: 13px; margin: 0; padding: 10px 14px 6px; display: flex; align-items: center; gap: 8px; }
  #side .compose { padding: 4px 14px 10px; border-bottom: 1px solid var(--tone2); display: flex; flex-direction: column; gap: 6px; }
  #side .tgt { font-size: 12px; color: var(--ink2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  #side .tgt b { color: var(--ink); font-family: Consolas, monospace; }
  #reqText { min-height: 72px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; }
  #side .row { display: flex; gap: 6px; align-items: center; }
  #side .hint { color: var(--ink2); font-size: 12px; }
  #reqFilter { display: flex; gap: 6px; padding: 8px 14px 4px; align-items: center; }
  #reqList { flex: 1; overflow-y: auto; padding: 4px 10px 30px; }
  #reqList .req { cursor: pointer; }  /* 카드를 누르면 그 탭·범위로 */
  #reqList .req:hover { box-shadow: 0 0 0 1px var(--line); }
  #reqList .req.cur { outline: 2px solid var(--sel); }
  #reqHint .warn { color: var(--warn); }
  /* 팝업 메뉴·토스트 */
  .menu { position: fixed; z-index: 60; background: #fff; border-radius: 12px; box-shadow: var(--sh2); padding: 6px; min-width: 190px; max-height: 70vh; overflow-y: auto; }
  .menu button { display: flex; width: 100%; text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: 8px; gap: 10px; align-items: center; }
  .menu button:hover:not(:disabled) { background: var(--tone); }
  .menu button:disabled { opacity: .4; cursor: default; }
  .menu button .k { margin-left: auto; color: var(--ink2); font-size: 11px; }
  .menu hr { border: 0; border-top: 1px solid var(--tone2); margin: 4px 2px; }
  .menu .h { font-size: 11px; color: var(--ink2); padding: 4px 10px 2px; font-weight: 700; }
  #toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: #322F2F; color: #fff; border-radius: 10px; padding: 8px 16px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 100; max-width: 80vw; white-space: pre-line; }
  #tabs button.t.hid { opacity: .5; font-style: italic; }  /* 엑셀에서 숨긴 시트 */
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <button id="menuBtn" title="메뉴"></button>
  <a class="chip sm" id="backLink" href="index.html" title="슬라이드 편집기로 돌아가기">← 편집기</a>
  <button class="chip sm" id="deckList" title="덱·시트 목록 - 골라서 이동 · 새 시트">☰ 목록</button>
  <h1 id="title"><span class="k">▦</span><span id="titleText">시트</span></h1>
  <span id="status" class="chip sm saved">저장됨</span>
  <button id="themeChip" class="chip sm" title="시트 테마">테마 없음</button>
  <span class="sp"></span>
  <button id="sessChip" class="chip sm off" title="요청을 처리할 AI 세션 - 눌러서 웹 세션 시작·진행 보기"><span class="dot"></span>세션 연결 없음 ▾</button>
  <button class="ib" id="undoBtn" title="실행 취소 (Ctrl+Z)" disabled>↶</button>
  <button class="ib" id="redoBtn" title="다시 실행 (Ctrl+Y)" disabled>↷</button>
  <button class="chip sm primary" id="exportBtn" title="엑셀(.xlsx)로 내보내기 - 받기">⇩ 엑셀로 내보내기</button>
  <button class="ib" id="sideBtn" title="요청 패널 보이기/숨기기">💬</button>
</header>
<div id="tools">
  <button class="ib" data-t="b" title="굵게 (Ctrl+B)"><b>B</b></button>
  <button class="ib" data-t="i" title="기울임 (Ctrl+I)"><i>I</i></button>
  <button class="ib" data-t="u" title="밑줄 (Ctrl+U)"><u>U</u></button>
  <select id="sizeSel" title="글자 크기(pt)"></select>
  <span class="vsep"></span>
  <label class="clr" title="글자색"><span>A</span><span class="bar" id="colorBar" style="background:#000"></span><input type="color" id="colorIn" value="#000000"></label>
  <label class="clr" title="배경(채우기)"><span>▧</span><span class="bar" id="fillBar" style="background:#fff"></span><input type="color" id="fillIn" value="#ffff00"></label>
  <button class="ib" data-t="clearClr" title="글자색·배경 지우기">⌫색</button>
  <span class="vsep"></span>
  <button class="ib" data-t="al" data-v="left" title="왼쪽 정렬">⯇</button>
  <button class="ib" data-t="al" data-v="center" title="가운데 정렬">≡</button>
  <button class="ib" data-t="al" data-v="right" title="오른쪽 정렬">⯈</button>
  <button class="ib" data-t="wrap" title="줄바꿈">↵</button>
  <span class="vsep"></span>
  <select id="fmtSel" title="표시 형식"></select>
  <span class="vsep"></span>
  <button class="ib" data-t="merge" title="셀 병합 / 병합 해제">⊞ 병합</button>
  <button class="ib" data-t="rowcol" title="행·열 삽입·삭제">행·열 ▾</button>
  <button class="ib" data-t="freeze" title="틀 고정 - 지금 셀의 위·왼쪽을 고정(다시 누르면 해제)">❄ 틀 고정</button>
  <span class="vsep"></span>
  <button class="ib" data-t="border" title="테두리 - 모든·바깥·아래·없음">▦ 테두리 ▾</button>
  <button class="ib" data-t="grid" title="눈금선 보이기/숨기기(이 탭)">＃ 눈금선</button>
  <span class="vsep" id="styleSep" hidden></span>
  <select id="styleSel" title="테마 셀 스타일 - 고른 범위에 적용(셀에 직접 준 서식이 이긴다)" hidden></select>
</div>
<div id="fbar">
  <input id="nameBox" title="셀 주소 - B3 · B2:D5 를 적고 Enter 로 이동" spellcheck="false">
  <span class="fx">fx</span>
  <input id="fxIn" spellcheck="false" placeholder="값 또는 = 로 시작하는 수식">
</div>
<div id="banner"><span id="bannerMsg"></span><span class="sp"></span><button class="chip sm" id="bnTheirs">밖의 것 다시 읽기</button><button class="chip sm primary" id="bnMine">내 것으로 덮어쓰기</button></div>
<main>
  <div id="center">
    <div id="gridWrap">
      <div id="gridIn">
        <table id="grid"></table>
        <div id="draws"></div>
        <div id="marks"></div>
        <div id="clipBox" class="ov" hidden></div>
        <div id="selBox" class="ov"></div>
        <div id="curBox" class="ov"></div>
        <div id="fillBox" class="ov" hidden></div>
        <div id="fillHandle" title="끌어서 채우기(Ctrl = 복사/증가 바꾸기) · 두 번 누르면 옆 열 끝까지 아래로"></div>
        <div id="fillTip" hidden></div>
        <textarea id="editor" spellcheck="false" autocomplete="off"></textarea>
        <button class="chip sm" id="addRows" title="아래에 빈 행을 더 둡니다">＋ 행 20개 더</button>
      </div>
    </div>
    <div id="tabsRow"><div id="tabs"></div><div id="sumBar" hidden title="누르면 숫자 개수·최소·최대도"></div></div>
  </div>
  <aside id="side">
    <div id="sideSplit" title="끌어서 폭 조절"></div>
    <h2>AI 요청 <span class="hint" style="font-weight:400">범위를 고르고 무엇을 바꿀지 적어 보내세요</span></h2>
    <div class="compose">
      <div class="tgt">대상 <b id="reqTarget">-</b><label style="margin-left:auto"><input type="checkbox" id="reqWhole"> 탭 전체</label></div>
      <textarea id="reqText" placeholder="예: 이 표 아래에 합계 행을 넣고 금액은 #,##0 으로 (Enter = 보내기, Shift+Enter = 줄바꿈 · 그림은 Ctrl+V)"></textarea>
      <div class="att" id="reqAtt"></div>
      <div class="row"><button class="att-btn" data-attach="tab" title="그림 붙여넣기(Ctrl+V) · 끌어다 놓기 · 파일 고르기">＋ 첨부</button><span style="flex:1"></span><button class="chip sm primary" id="reqSend">요청 보내기</button></div>
      <div id="reqHint"></div>
      <input type="file" id="attFile" multiple accept="image/*,.pdf,.txt,.md,.csv,.json,.pptx,.docx,.xlsx" style="display:none">
    </div>
    <div id="reqFilter"></div>
    <div id="reqList"></div>
  </aside>
</main>
<div id="toast"></div>
<div id="sessDlg"><div class="box"></div></div>

<script src="nexa-merge.js"></script>

<script src="sheetcalc.js"></script><!-- 수식 계산(NexaCalc) - Python sheet_calc 와 같은 규칙 -->
<script src="sheet.js"></script>
<script src="sheetx.js"></script>
</body>
