<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>발표자 보기</title>
<!-- 발표자 보기: /studio/presenter.html?deck=<id> - 편집기 발표 모드(P 키)가 연다. 지금 슬라이드·다음 슬라이드·노트·경과 시간.
     BroadcastChannel("nexa-present:<deck>") 로 편집기 발표 화면과 쪽을 맞춘다({idx} 수신, {goto} 송신). -->
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 14px/1.5 "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
  #wrap { display: grid; grid-template-columns: 3fr 2fr; grid-template-rows: auto 1fr; gap: 12px; padding: 12px; height: 100vh; box-sizing: border-box; }
  #bar { grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; }
  #bar button { background: #333; color: #eee; border: 0; border-radius: 8px; padding: 6px 14px; font: inherit; cursor: pointer; }
  #bar button:hover { background: #444; }
  #time { font: 20px Consolas, monospace; margin-left: auto; }
  .box { position: relative; background: #000; border-radius: 10px; overflow: hidden; }
  .box .st { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; background: #fff; }
  .box .cap { position: absolute; left: 8px; top: 6px; background: rgba(0,0,0,.55); color: #ccc; font-size: 12px; padding: 2px 8px; border-radius: 6px; z-index: 2; }
  #right { display: grid; grid-template-rows: auto 1fr; gap: 12px; min-height: 0; }
  #next { aspect-ratio: 16 / 9; }
  #notes { background: #1c1c1c; border-radius: 10px; padding: 14px 16px; overflow-y: auto; font-size: 17px; line-height: 1.6; white-space: pre-wrap; }
</style>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="../api/fontcss">
<style id="rs-css"></style>
</head>
<body>
<div id="wrap">
  <div id="bar"><button id="prev">◀ 이전</button><button id="next1">다음 ▶</button><span id="pos"></span><span id="time">00:00</span><button id="reset" title="시간 다시">⟲</button></div>
  <div class="box" id="cur"><span class="cap">지금</span><div class="st" id="curSt"></div></div>
  <div id="right"><div class="box" id="next"><span class="cap">다음</span><div class="st" id="nextSt"></div></div><div id="notes"></div></div>
</div>
<script src="i18n.js"></script>
<script src="render.js"></script>
<script>
(async () => {
  const BASE = (location.pathname.match(/^\/w\/[^/]+/) || [""])[0];
  window.RENDER_BASE = BASE + "/";
  const q = new URLSearchParams(location.search);
  const id = q.get("deck") || "ch00";
  const [tok, deck] = await Promise.all([fetch("tokens.json").then(r => r.json()), fetch(BASE + "/api/deck/" + id).then(r => r.json())]);
  Render.setTokens(tok);
  try { Render.setLangs(await (await fetch("code_langs.json")).json()); } catch (e) { /* 없으면 SQL 만 */ }
  Render.setDeckFonts && Render.setDeckFonts(deck.fontPreset);
  document.getElementById("rs-css").textContent = Render.css();
  const ch = new BroadcastChannel("nexa-present:" + id);
  let idx = parseInt(q.get("n") || "1", 10) - 1, t0 = Date.now();
  const $ = (s) => document.querySelector(s);
  function fit(box, st) { const r = box.getBoundingClientRect(), k = Math.min(r.width / 1280, r.height / 720); st.style.transform = `scale(${k})`; st.style.left = (r.width - 1280 * k) / 2 + "px"; st.style.top = (r.height - 720 * k) / 2 + "px"; }
  function render() {
    idx = Math.max(0, Math.min(deck.slides.length - 1, idx));
    const s = deck.slides[idx], n = deck.slides[idx + 1];
    $("#curSt").innerHTML = Render.renderSlide(s, idx + 1);
    $("#nextSt").innerHTML = n ? Render.renderSlide(n, idx + 2) : '<div style="padding:40px;font-size:40px;color:#888">끝</div>';
    $("#notes").textContent = s.notes || "(노트 없음)";
    $("#pos").textContent = `${idx + 1} / ${deck.slides.length}`;
    fit($("#cur"), $("#curSt")); fit($("#next"), $("#nextSt"));
  }
  function go(d) { idx = Math.max(0, Math.min(deck.slides.length - 1, idx + d)); render(); ch.postMessage({ goto: idx }); }
  ch.onmessage = (e) => { if (e.data && typeof e.data.idx === "number" && e.data.idx !== idx) { idx = e.data.idx; render(); } };
  $("#prev").onclick = () => go(-1); $("#next1").onclick = () => go(1); $("#reset").onclick = () => { t0 = Date.now(); };
  document.addEventListener("keydown", (e) => { if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); go(1); } else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); go(-1); } });
  addEventListener("resize", render);
  setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); $("#time").textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }, 1000);
  render();
  ch.postMessage({ hello: true });
})();
</script>
</body>
</html>
