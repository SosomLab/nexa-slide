<style>
  :root {
    --p: #A91F24; --pc: #FFDAD6; --onpc: #410004;
    --bg: #F4F1F1; --card: #FFFFFF; --tone: #F2EFEF; --tone2: #ECE8E8; --ink: #1F1B1B; --ink2: #534343; --line: #D8C2C0;
    --ok: #146C2E; --okc: #C4EED0; --warnc: #FFDEA6; --warn: #7D5700; --info: #0B4A9E; --infoc: #D6E3FF; --err: #BA1A1A;
    --mark: #E5484D; --r: 16px; --font: "Malgun Gothic", "맑은 고딕", sans-serif;
    --sh1: 0 1px 2px rgba(0,0,0,.08); --sh2: 0 6px 24px rgba(0,0,0,.16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--font); display: flex; flex-direction: column; overflow: hidden; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  kbd { font: 11px Consolas, monospace; background: var(--tone); border-radius: 5px; padding: 0 5px; border: 1px solid var(--line); }
  .chip { border: 0; background: var(--tone); border-radius: 999px; padding: 6px 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .chip:hover { background: var(--tone2); }
  .chip.on { background: var(--ink); color: #fff; }
  .chip.primary { background: var(--p); color: #fff; font-weight: 700; }
  .chip.primary:hover { filter: brightness(1.08); }
  .chip.sm { padding: 3px 10px; font-size: 12px; }
  .chip:disabled { opacity: .45; cursor: default; }
  .icon { width: 30px; height: 30px; padding: 0; justify-content: center; font-size: 15px; }
  .ib { border: 0; background: none; border-radius: 8px; height: 30px; min-width: 30px; padding: 0 7px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
  .ib:hover { background: var(--tone); }
  .ib.on { background: var(--ink); color: #fff; }
  .ib:disabled { opacity: .4; cursor: default; }
  .vsep { width: 1px; align-self: stretch; background: var(--line); margin: 4px 4px; }
  /* ---------- 머리줄 ---------- */
  header { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--card); box-shadow: var(--sh1); z-index: 6; min-height: 48px; }
  header img.logo { height: 24px; }
  header h1 { font-size: 14px; margin: 0 4px 0 2px; font-weight: 700; white-space: nowrap; }
  header .sp { flex: 1; }
  #deckBar { display: flex; align-items: center; gap: 2px; max-width: 46vw; min-width: 0; }
  #deckList { border: 0; background: var(--tone); border-radius: 8px; padding: 5px 9px; color: var(--ink2); font-size: 14px; flex: none; }
  #deckList:hover { background: var(--line); }
  #deckBar .dk-arrow { border: 0; background: none; border-radius: 8px; padding: 4px 4px; color: var(--ink2); font-size: 18px; line-height: 1; flex: none; display: none; }
  #deckBar.scroll .dk-arrow { display: inline-block; }
  #deckBar .dk-arrow:hover { background: var(--tone); } #deckBar .dk-arrow:disabled { opacity: .3; }
  #deckTabs { display: flex; gap: 4px; overflow-x: auto; min-width: 0; scrollbar-width: none; cursor: grab; user-select: none; }
  #deckTabs::-webkit-scrollbar { display: none; }
  #deckTabs.dragging { cursor: grabbing; }
  #deckTabs button { border: 0; background: none; border-radius: 10px; padding: 6px 12px; white-space: nowrap; color: var(--ink2); max-width: 20em; overflow: hidden; text-overflow: ellipsis; flex: none; }  /* 긴 제목은 앞에서부터 20em(한글 약 20자·영문 약 40자)까지, 끝은 … */
  #deckTabs button:hover { background: var(--tone); }
  #deckTabs button.on { background: var(--pc); color: var(--onpc); font-weight: 700; }
  #deckTabs button.add { padding: 6px 8px; color: var(--ink2); font-weight: 700; }
  #status { min-width: 80px; justify-content: center; }
  #status.saved { background: var(--okc); color: var(--ok); }
  #status.dirty { background: var(--warnc); color: var(--warn); }
  #status.conflict, #status.error { background: var(--pc); color: var(--p); font-weight: 700; }
  #sessChip { cursor: pointer; }
  #sessDlg { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 110; display: none; align-items: center; justify-content: center; }
  #sessDlg.show { display: flex; }
  #sessDlg .box { background: #fff; border-radius: 18px; padding: 18px 22px; width: min(640px, 94vw); max-height: 86vh; overflow-y: auto; box-shadow: var(--sh2); display: flex; flex-direction: column; gap: 10px; }
  #sessDlg label.f { display: block; font-weight: 700; font-size: 12px; margin: 6px 0 3px; }
  #sessDlg select, #sessDlg input[type=text] { font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  #sessDlg .ev { font: 12px Consolas, monospace; background: var(--tone); border-radius: 10px; padding: 8px 10px; max-height: 46vh; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  #sessDlg .ev .e { padding: 1px 0; border-bottom: 1px dashed var(--tone2); }
  #sessDlg .ev .e.err, #sessDlg .ev .e.warn { color: var(--err); }
  #sessDlg .ev .e.turn\.end { color: var(--ok); }
  #sessDlg .hint { color: var(--ink2); font-size: 12px; }
  #sessChip.on { background: var(--okc); color: var(--ok); }
  #sessChip.busy { background: var(--infoc); color: var(--info); }
  #sessChip.off { background: var(--tone2); color: var(--ink2); }
  #sessChip .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  #dl { text-decoration: none; }
  /* ---------- 본문 ---------- */
  main { flex: 1; display: grid; grid-template-columns: var(--railW, 226px) 1fr var(--rightW, 392px); min-height: 0; }
  body.noright main { grid-template-columns: var(--railW, 226px) 1fr 0; }
  body.noright #right { display: none; }
  /* 왼쪽 레일 */
  #left { overflow-y: auto; padding: 10px 8px 80px 10px; position: relative; }
  .thumb { position: relative; margin: 0 0 10px 20px; border-radius: 10px; background: #fff; cursor: pointer; box-shadow: var(--sh1); outline: 2px solid transparent; }
  .thumb:hover { outline: 2px solid var(--line); }
  .thumb.cur { outline: 3px solid var(--p); }
  .thumb .num { position: absolute; left: -20px; top: 2px; width: 16px; text-align: right; color: var(--ink2); font-size: 11px; }
  .thumb .vp { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; border-radius: 10px; pointer-events: none; }
  .thumb .vp > .rs-slide { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .thumb .tools { position: absolute; right: 4px; top: 4px; display: none; gap: 4px; }
  .thumb:hover .tools { display: flex; }
  .thumb .tools button { border: 0; border-radius: 999px; background: rgba(255,255,255,.95); box-shadow: 0 1px 2px rgba(0,0,0,.2); font-size: 11px; padding: 2px 8px; }
  .thumb .tools button[data-act="dup"]:hover { background: var(--okc); color: var(--ok); font-weight: 700; }
  .thumb .tools button[data-act="del"]:hover { background: var(--p); color: #fff; font-weight: 700; }
  .thumb .badges { position: absolute; left: 6px; bottom: 6px; right: 6px; display: flex; gap: 4px; pointer-events: none; }
  .thumb .bd { border-radius: 999px; font-size: 11px; line-height: 18px; padding: 0 8px; font-weight: 700; display: inline-flex; align-items: center; height: 18px; box-sizing: border-box; box-shadow: 0 1px 2px rgba(0,0,0,.2); white-space: nowrap; }  /* 배지 높이 고정 - 요청·처리·변경 모두 같은 높이 */  /* 복제·삭제 단추와 같은 크기 */
  .bd.draft { background: var(--mark); color: #fff; }
  .bd.hid { background: #6b6b6b; color: #fff; }  /* 숨김 슬라이드 */
  .bd.req { background: var(--warnc); color: var(--warn); }
  .bd.work { background: var(--infoc); color: var(--info); }
  .bd.chk { background: var(--warnc); color: var(--warn); margin-left: auto; }
  .bd.chk.err { background: var(--err); color: #fff; }
  .thumb.drop-before::before { content: ""; position: absolute; left: 0; right: 0; top: -6px; height: 3px; background: var(--p); border-radius: 2px; }
  .thumb.drop-after::after { content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 3px; background: var(--p); border-radius: 2px; }
  #addSlide { margin-left: 20px; width: calc(100% - 20px); justify-content: center; }
  #railSplit { position: absolute; top: 0; right: 0; width: 5px; height: 100%; cursor: col-resize; }
  /* 공통 팝업 */
  .menu { position: fixed; z-index: 60; background: #fff; border-radius: 12px; box-shadow: var(--sh2); padding: 6px; min-width: 200px; max-height: 70vh; overflow-y: auto; }
  .menu button { display: flex; width: 100%; text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: 8px; gap: 10px; align-items: center; }
  .menu button:hover:not(:disabled) { background: var(--tone); }
  .menu button:disabled { opacity: .4; cursor: default; }
  .menu button .k { margin-left: auto; color: var(--ink2); font-size: 11px; }
  .menu hr { border: 0; border-top: 1px solid var(--tone2); margin: 4px 2px; }
  .menu .h { font-size: 11px; color: var(--ink2); padding: 4px 10px 2px; font-weight: 700; }
  /* ---------- 가운데 ---------- */
  #center { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
  #banner { margin: 8px 12px 0; padding: 10px 14px; border-radius: 12px; background: var(--pc); color: var(--onpc); display: none; align-items: center; gap: 10px; }
  #banner.show { display: flex; }
  #banner .sp { flex: 1; }
  /* 새로 고침·새 덱 안내 - 어느 슬라이드를 보든 같은 자리에 */
  #notice { margin: 8px 12px 0; padding: 8px 10px 8px 14px; border-radius: 12px; background: #D6E3FF; color: #0B2E6B; display: none; align-items: center; gap: 8px; flex-wrap: wrap; }
  #notice.show { display: flex; }
  #notice .sp { flex: 1; }
  #work { flex: 1; display: flex; gap: 14px; padding: 8px 12px 0; min-height: 0; }
  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; position: relative; }
  .pane .cap { color: var(--ink2); font-size: 12px; display: flex; gap: 8px; align-items: center; }
  /* 캔버스 보조 도구줄 */
  #subbar { align-self: center; display: flex; align-items: center; gap: 2px; background: var(--card); border-radius: 14px; box-shadow: var(--sh1); padding: 4px 6px; flex-wrap: wrap; justify-content: center; }
  #modeSeg { display: inline-flex; background: var(--tone); border-radius: 10px; padding: 2px; }
  #modeSeg button { border: 0; background: none; border-radius: 8px; padding: 4px 12px; display: inline-flex; gap: 6px; align-items: center; }
  #modeSeg button.on { background: #fff; box-shadow: var(--sh1); font-weight: 700; }
  #subbar .hint2 { color: var(--ink2); font-size: 12px; padding: 0 6px; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #subbar { flex-wrap: nowrap; max-width: 100%; overflow: hidden; }
  #subbar > *, #subbar button, #modeSeg, #drawTools, #addTools { flex-shrink: 0; white-space: nowrap; }
  #subbar .hint2 { flex-shrink: 1; min-width: 0; }
  .ib, .chip { white-space: nowrap; }
  #drawTools { display: none; gap: 2px; }
  body.m-draw #drawTools { display: inline-flex; }
  #addTools { display: none; }
  body.m-edit #addTools { display: inline-flex; }
  .viewport { flex: 1; position: relative; min-height: 0; overflow: auto; border-radius: 12px; }
  #vpEdit { display: flex; }
  #stageWrap { position: relative; margin: auto; flex: none; }
  body.panning #vpEdit, body.panning #vpEdit * { cursor: grab !important; }
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; box-shadow: 0 2px 12px rgba(0,0,0,.14); background: #fff; }
  #host, #ov, #draw, #marks { position: absolute; inset: 0; }
  #ov, #marks { pointer-events: none; }
  #draw { width: 1280px; height: 720px; pointer-events: none; overflow: visible; }
  body.m-draw #draw { pointer-events: auto; cursor: crosshair; }
  body.m-draw.t-pin #draw { cursor: copy; }
  #host .rs-el[data-type="arrow"]::before, #host .rs-el[data-type="line"]::before { content: ""; position: absolute; inset: -7px; }
  body.m-edit #host .rs-el:hover { outline: 1px dashed rgba(169,31,36,.45); }
  body.m-pick #host .rs-el { cursor: pointer; }
  body.m-pick #host .rs-el:hover { outline: 2px solid rgba(229,72,77,.65); }
  .selbox { position: absolute; border: 2px solid var(--p); pointer-events: none; }
  .selbox.locked { border-style: dashed; }
  .selbox.pick { border-color: var(--mark); border-radius: 4px; }
  .selbox.multi { border-style: solid; opacity: .85; }
  .selbox.group { border-style: dashed; border-color: var(--ink2); }
  .marquee { position: absolute; border: 1px dashed var(--p); background: rgba(169, 31, 36, .06); pointer-events: none; }
  /* 켜기/끄기 스위치 - 켜짐 초록 트랙 · 흰 손잡이 */
  .switch, .row label.switch { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; flex: none; width: auto; min-width: 0; margin-left: 8px; font-size: 12px; color: var(--ink2); white-space: nowrap; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .switch .track { position: relative; width: 34px; height: 20px; border-radius: 999px; background: #C9C3C3; transition: background .15s; }
  .switch .track::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s; }
  .switch input:checked + .track { background: #2EA44F; } .switch input:checked + .track::after { left: 17px; }
  .switch input:focus-visible + .track { outline: 2px solid var(--p); outline-offset: 2px; }
  .lang-pick { width: 260px; } .lang-pick input { width: 100%; margin-bottom: 4px; }
  .lang-pick .lang-list { max-height: 300px; overflow-y: auto; }
  .lang-pick .lang-list button { display: flex; justify-content: space-between; } .lang-pick .lang-list button.on { background: var(--pc); color: var(--onpc); font-weight: 700; }
  .lang-pick .lang-list small { color: var(--ink2); font-family: Consolas, monospace; }
  .multi-n { font-weight: 700; padding: 0 6px; color: var(--p); white-space: nowrap; }
  .multi-hint { background: var(--pc); color: var(--onpc); border-radius: 8px; padding: 6px 8px; margin: 4px 0 8px; }
  .hd { position: absolute; background: #fff; border: 2px solid var(--p); border-radius: 50%; pointer-events: auto; }
  .editor { position: absolute; background: rgba(255,255,255,.97); outline: 3px solid var(--p); white-space: pre-wrap; overflow: visible; z-index: 3; pointer-events: auto; padding: 2px; min-height: 20px; color: #1F1B1B; }
  #ov .chkbox { position: absolute; border: 2px dashed var(--err); background: rgba(186, 26, 26, .08); pointer-events: none; }
  /* 요청 표시(초안·대기·처리 중) */
  /* 밖에서 바뀐 내용(변경 탭·배지·점선) */
  #marks .langtag { position: absolute; font: 600 11px/1 var(--font); color: #fff; background: #3B4252; border-radius: 6px 6px 0 0; padding: 4px 8px 3px; white-space: nowrap; opacity: .9; }
  #marks .chgbox { position: absolute; border: 2px dashed #1D5FD1; border-radius: 4px; background: rgba(29, 95, 209, .06); }
  .bd.chg { background: #D6E3FF; color: #0B2E6B; }
  .chg-rec { border-top: 1px solid var(--tone2); padding: 8px 0; }
  .chg-h { margin-bottom: 4px; word-break: keep-all; overflow-wrap: anywhere; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .chg-h .chg-tg { margin-left: auto; padding: 2px 10px; }
  .chg-rec:not(.on) .chg-it { opacity: .6; }
  .chg-rec.on .chg-h .chg-tg { background: #D6E3FF; color: #0B2E6B; }
  .chg-it { padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 12.5px; }
  .chg-it:hover { background: var(--tone); }
  .chg-it.gone, .chg-el.gone { cursor: default; opacity: .7; }
  .chg-it .k { font-size: 11px; border-radius: 999px; padding: 1px 7px; background: #D6E3FF; color: #0B2E6B; }
  .chg-it .k.추가 { background: var(--okc); color: var(--ok); } .chg-it .k.삭제 { background: #FFDAD6; color: #93000A; }
  .chg-el { margin: 3px 0 0 14px; padding: 2px 6px; border-left: 2px solid #A8C3F0; font-size: 12px; }
  .chg-el:hover { background: #EEF3FD; }
  .chg-tx { color: var(--ink2); margin-top: 2px; word-break: break-all; } .chg-tx s { color: #93000A; }
  /* 변경 출처 배지(행위 종류 .k 와 축 분리) - 편집기 초록 · Claude 파랑 · 빌드 호박 · 외부 회색 · 추정은 점선 */
  .org { font-size: 11px; border-radius: 999px; padding: 1px 7px; white-space: nowrap; }
  /* 클래스는 o- 접두 - "editor" 는 글자 편집 상자(.editor, position:absolute)와 이름이 겹친다 */
  .org.o-mine { background: var(--okc); color: var(--ok); } .org.o-editor { background: #CDEFE6; color: #00695C; } .org.o-claude { background: var(--infoc); color: var(--info); }
  .org.o-build { background: var(--warnc); color: var(--warn); } .org.o-external { background: var(--tone2); color: var(--ink2); }
  .org.inf { outline: 1px dashed currentColor; outline-offset: -1px; }
  /* 목록 전체를 가로로 넘긴다(.hscroll) - 제목 칸은 자르지 않는다. 요소 목록(.ellist)과 같은 규칙 */
  .hscroll { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
  .chg-tbl { width: max-content; min-width: 100%; border-collapse: collapse; font-size: 12px; }
  /* 제목 칸을 최대로 - 번호·출처·시각은 내용에 맞는 최소 폭 */
  .chg-tbl col.n { width: 24px; } .chg-tbl col.o { width: 50px; } .chg-tbl col.a { width: 40px; }
  .chg-tbl td.o, .chg-tbl td.a { padding-left: 2px; padding-right: 2px; text-align: right; } .chg-tbl td.n { padding-left: 2px; }
  .chg-tbl .org { padding: 1px 5px; } .chg-tbl tr { cursor: pointer; } .chg-tbl tr:hover { background: var(--tone); }
  .chg-tbl td { padding: 4px 6px; border-bottom: 1px solid var(--tone2); vertical-align: top; white-space: nowrap; }
  .chg-tbl td.n { color: var(--ink2); width: 24px; }
  /* 변경 탭 머리 - 설명(ⓘ 토글) · 출처 필터 칩 · 동작 단추(균등 폭) */
  .chg-top { display: flex; align-items: center; gap: 6px; } .chg-top h3 { flex: 1; margin: 0; }
  .chg-ibtn { width: 28px; height: 28px; min-width: 28px; padding: 0; border-radius: 50%; color: var(--ink2); }
  .chg-ibtn.on { background: var(--ink); color: #fff; }
  .chg-info { margin-top: 6px; padding: 8px 10px; background: var(--card); border-radius: 10px; }
  .chg-fil { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  /* 필터 칩 - 미선택 회색 · 선택 검정 바탕 흰 글자 · 올리면 글자색 강조. 높이 고정(개수 숫자 유무와 상관없이 같게) */
  .chg-fil button { border: 0; border-radius: 999px; height: 26px; padding: 0 11px; display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; line-height: 1; font-weight: 700; white-space: nowrap; background: #E7E0E0; color: #5F5555; }
  .chg-fil button b { font-weight: 700; opacity: .8; }
  .chg-fil button:hover { color: var(--p); }
  .chg-fil button.on { background: var(--ink); color: #fff; }
  .chg-fil button.on:hover { color: var(--pc); }
  /* 동작 단추 - 진한 회색 바탕 기본 · 올리면 글자색 강조 · 같은 폭 */
  .chg-acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }

        <div id="notesBar"><span class="nlbl" title="PPTX 로 내보내면 슬라이드 노트로, 발표자 보기(F5 → 발표자)에서는 아래 글로 보인다">발표자 노트 <span class="hint" id="notesInfo2"></span></span><div id="notesChips"></div></div>
        <textarea id="notesTa" spellcheck="true" placeholder="이 슬라이드에서 말할 내용 - PPTX 노트·발표자 보기에 들어간다"></textarea>
      </div>
      <div class="bpanel" id="bp-outline"><div id="outlineList"></div></div>
      <div class="bpanel" id="bp-check"></div>
    </div>
    <div id="foot">
      <span class="tabs2" id="bTabs">
        <button data-b="notes" class="on" title="발표자 노트">노트 <span class="hint" id="notesInfo" style="margin:0"></span></button>
        <button data-b="outline" title="개요 - 슬라이드 제목 목록">개요</button>
        <button data-b="check" title="레이아웃 검사 - 저장할 때마다 자동">검사 <span class="cnt" id="chkCnt2" style="display:none"></span></button>
        <button id="bFold" title="아래 패널 접기/펴기">▾</button>
      </span>
      <span class="sp"></span>
      <button class="ib" id="prevBtn" title="이전 슬라이드 (PageUp)">◀</button>
      <span id="slideCounter">- / -</span>
      <button class="ib" id="nextBtn" title="다음 슬라이드 (PageDown)">▶</button>
      <span class="sp"></span>
      <button class="ib" id="zoomOut" title="축소 (Ctrl+-)">−</button>
      <input type="range" id="zoomSlider" min="10" max="300" step="1" title="확대 (Ctrl+휠)">
      <button class="ib" id="zoomIn" title="확대 (Ctrl+=)">＋</button>
      <button class="ib" id="zoomPct" title="100% 로">100%</button>
      <button class="ib" id="zoomFit" title="화면 맞춤 (Ctrl+0)">⤢ 맞춤</button>
      <button class="ib" id="layMax" title="최대화 배치 - 노트·개요·검사를 오른쪽 아래로 옮기고 가운데를 슬라이드에 (Ctrl+Shift+M)">⛶ 최대화</button>
      <button class="ib" id="layRestore" title="원래 배치로 - 노트·개요·검사를 다시 아래로 (Ctrl+Shift+M)">🗗 복원</button>
    </div>
  </section>
  <aside id="right"><div id="rightSplit" title="끌어서 폭 조절 · 두 번 눌러 처음 폭"></div>
    <div class="tabs">
      <button class="chip on" data-tab="props">속성</button>
      <button class="chip" data-tab="reqs">요청 <span class="cnt" id="reqCnt" style="display:none"></span></button>
      <button class="chip" data-tab="hist">기록</button>
      <button class="chip" data-tab="chg" title="변경 원장 - 편집기·Claude·빌드·외부의 변경, 출처, 최근 수정 대상, 되돌리기">변경 <span class="cnt" id="chgCnt" style="display:none"></span></button>
    </div>
    <div class="panel on" id="tab-props"></div>
    <div class="panel" id="tab-reqs"></div>
    <div class="panel" id="tab-hist"></div>
    <div class="panel" id="tab-chg"></div>
    <div id="rDock"></div>
  </aside>
</main>
<div id="present"><div id="presentStage"></div><div id="presentInfo"></div><div id="presentNotes"></div></div>
<div id="help"><div class="box"></div></div>
<div id="fontDlg"><div class="box"></div></div>
<div id="sessDlg"><div class="box"></div></div><!-- 웹 AI 세션 - 시작 창 · 진행 패널 · 턴 로그 (studio.js) -->
<div id="addDlg"><div class="box">
  <div class="ad-h"><h3 style="margin:0" id="adTitle">슬라이드 추가</h3>
    <span class="seg" id="adTab"><button data-adtab="type" class="on">유형으로</button><button data-adtab="layout">레이아웃으로</button></span>
    <input type="search" id="adQ" placeholder="찾기 - 결정, 추이, 사례…" style="width:200px"><span style="flex:1"></span>
    <button class="chip sm" data-adclose="1">닫기 (Esc)</button></div>
  <div class="ad-groups" id="adGroups"></div>
  <div class="ad-body" id="adBody"></div>
  <div class="hint" style="margin-top:6px" id="adHint"></div>
</div></div>
<div id="toast"></div>
<script src="render.js"></script>
<script src="studio.js"></script>
</body>
</html>
