<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nexa-slide</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="stylesheet" href="fonts.css">
<script src="menu.js"></script>
<style id="rs-css"></style>
<style>
  :root {
    --p: #A91F24; --pc: #FFDAD6; --onpc: #410004;
    --bg: #F4F1F1; --card: #FFFFFF; --tone: #F2EFEF; --tone2: #ECE8E8; --ink: #1F1B1B; --ink2: #534343; --line: #D8C2C0;
    --ok: #146C2E; --okc: #C4EED0; --warnc: #FFDEA6; --warn: #7D5700; --info: #0B4A9E; --infoc: #D6E3FF; --err: #BA1A1A;
    --mark: #E5484D; --r: 16px; --font: "Malgun Gothic", "맑은 고딕", sans-serif;
    --sh1: 0 1px 2px rgba(0,0,0,.08); --sh2: 0 6px 24px rgba(0,0,0,.16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--font); display: flex; flex-direction: column; overflow: hidden; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  kbd { font: 11px Consolas, monospace; background: var(--tone); border-radius: 5px; padding: 0 5px; border: 1px solid var(--line); }
  .chip { border: 0; background: var(--tone); border-radius: 999px; padding: 6px 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .chip:hover { background: var(--tone2); }
  .chip.on { background: var(--ink); color: #fff; }
  .chip.primary { background: var(--p); color: #fff; font-weight: 700; }
  .chip.primary:hover { filter: brightness(1.08); }
  .chip.sm { padding: 3px 10px; font-size: 12px; }
  .chip:disabled { opacity: .45; cursor: default; }
  .icon { width: 30px; height: 30px; padding: 0; justify-content: center; font-size: 15px; }
  .ib { border: 0; background: none; border-radius: 8px; height: 30px; min-width: 30px; padding: 0 7px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
  .ib:hover { background: var(--tone); }
  .ib.on { background: var(--ink); color: #fff; }
  .ib:disabled { opacity: .4; cursor: default; }
  .vsep { width: 1px; align-self: stretch; background: var(--line); margin: 4px 4px; }
  /* ---------- 머리줄 ---------- */
  header { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--card); box-shadow: var(--sh1); z-index: 6; min-height: 48px; }
  header img.logo { height: 24px; }
  header h1 { font-size: 14px; margin: 0 4px 0 2px; font-weight: 700; white-space: nowrap; }
  header .sp { flex: 1; }
  #deckTabs { display: flex; gap: 4px; overflow-x: auto; max-width: 46vw; scrollbar-width: thin; }
  #deckTabs button { border: 0; background: none; border-radius: 10px; padding: 6px 12px; white-space: nowrap; color: var(--ink2); }
  #deckTabs button:hover { background: var(--tone); }
  #deckTabs button.on { background: var(--pc); color: var(--onpc); font-weight: 700; }
  #status { min-width: 80px; justify-content: center; }
  #status.saved { background: var(--okc); color: var(--ok); }
  #status.dirty { background: var(--warnc); color: var(--warn); }
  #status.conflict, #status.error { background: var(--pc); color: var(--p); font-weight: 700; }
  #sessChip { cursor: default; }
  #sessChip.on { background: var(--okc); color: var(--ok); }
  #sessChip.busy { background: var(--infoc); color: var(--info); }
  #sessChip.off { background: var(--tone2); color: var(--ink2); }
  #sessChip .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  #dl { text-decoration: none; }
  /* ---------- 본문 ---------- */
  main { flex: 1; display: grid; grid-template-columns: var(--railW, 210px) 1fr var(--rightW, 330px); min-height: 0; }
  body.noright main { grid-template-columns: var(--railW, 210px) 1fr 0; }
  body.noright #right { display: none; }
  /* 왼쪽 레일 */
  #left { overflow-y: auto; padding: 10px 8px 80px 10px; position: relative; }
  .thumb { position: relative; margin: 0 0 10px 20px; border-radius: 10px; background: #fff; cursor: pointer; box-shadow: var(--sh1); outline: 2px solid transparent; }
  .thumb:hover { outline: 2px solid var(--line); }
  .thumb.cur { outline: 3px solid var(--p); }
  .thumb .num { position: absolute; left: -20px; top: 2px; width: 16px; text-align: right; color: var(--ink2); font-size: 11px; }
  .thumb .vp { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; border-radius: 10px; pointer-events: none; }
  .thumb .vp > .rs-slide { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .thumb .tools { position: absolute; right: 4px; top: 4px; display: none; gap: 4px; }
  .thumb:hover .tools { display: flex; }
  .thumb .tools button { border: 0; border-radius: 999px; background: rgba(255,255,255,.95); box-shadow: 0 1px 2px rgba(0,0,0,.2); font-size: 11px; padding: 2px 8px; }
  .thumb .tools button[data-act="dup"]:hover { background: var(--okc); color: var(--ok); font-weight: 700; }
  .thumb .tools button[data-act="del"]:hover { background: var(--p); color: #fff; font-weight: 700; }
  .thumb .badges { position: absolute; left: 6px; bottom: 6px; right: 6px; display: flex; gap: 4px; pointer-events: none; }
  .thumb .bd { border-radius: 999px; font-size: 10.5px; padding: 0 7px; font-weight: 700; }
  .bd.draft { background: var(--mark); color: #fff; }
  .bd.req { background: var(--warnc); color: var(--warn); }
  .bd.work { background: var(--infoc); color: var(--info); }
  .bd.chk { background: var(--warnc); color: var(--warn); margin-left: auto; }
  .bd.chk.err { background: var(--err); color: #fff; }
  .thumb.drop-before::before { content: ""; position: absolute; left: 0; right: 0; top: -6px; height: 3px; background: var(--p); border-radius: 2px; }
  .thumb.drop-after::after { content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 3px; background: var(--p); border-radius: 2px; }
  #addSlide { margin-left: 20px; width: calc(100% - 20px); justify-content: center; }
  #railSplit { position: absolute; top: 0; right: 0; width: 5px; height: 100%; cursor: col-resize; }
  /* 공통 팝업 */
  .menu { position: fixed; z-index: 60; background: #fff; border-radius: 12px; box-shadow: var(--sh2); padding: 6px; min-width: 200px; max-height: 70vh; overflow-y: auto; }
  .menu button { display: flex; width: 100%; text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: 8px; gap: 10px; align-items: center; }
  .menu button:hover:not(:disabled) { background: var(--tone); }
  .menu button:disabled { opacity: .4; cursor: default; }
  .menu button .k { margin-left: auto; color: var(--ink2); font-size: 11px; }
  .menu hr { border: 0; border-top: 1px solid var(--tone2); margin: 4px 2px; }
  .menu .h { font-size: 11px; color: var(--ink2); padding: 4px 10px 2px; font-weight: 700; }
  /* ---------- 가운데 ---------- */
  #center { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
  #banner { margin: 8px 12px 0; padding: 10px 14px; border-radius: 12px; background: var(--pc); color: var(--onpc); display: none; align-items: center; gap: 10px; }
  #banner.show { display: flex; }
  #banner .sp { flex: 1; }
  #work { flex: 1; display: flex; gap: 14px; padding: 8px 12px 0; min-height: 0; }
  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; position: relative; }
  .pane .cap { color: var(--ink2); font-size: 12px; display: flex; gap: 8px; align-items: center; }
  /* 캔버스 보조 도구줄 */
  #subbar { align-self: center; display: flex; align-items: center; gap: 2px; background: var(--card); border-radius: 14px; box-shadow: var(--sh1); padding: 4px 6px; flex-wrap: wrap; justify-content: center; }
  #modeSeg { display: inline-flex; background: var(--tone); border-radius: 10px; padding: 2px; }
  #modeSeg button { border: 0; background: none; border-radius: 8px; padding: 4px 12px; display: inline-flex; gap: 6px; align-items: center; }
  #modeSeg button.on { background: #fff; box-shadow: var(--sh1); font-weight: 700; }
  #subbar .hint2 { color: var(--ink2); font-size: 12px; padding: 0 6px; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #subbar { flex-wrap: nowrap; max-width: 100%; overflow: hidden; }
  #subbar > *, #subbar button, #modeSeg, #drawTools, #addTools { flex-shrink: 0; white-space: nowrap; }
  #subbar .hint2 { flex-shrink: 1; min-width: 0; }
  .ib, .chip { white-space: nowrap; }
  #drawTools { display: none; gap: 2px; }
  body.m-draw #drawTools { display: inline-flex; }
  #addTools { display: none; }
  body.m-edit #addTools { display: inline-flex; }
  .viewport { flex: 1; position: relative; min-height: 0; overflow: auto; border-radius: 12px; }
  #vpEdit { display: flex; }
  #stageWrap { position: relative; margin: auto; flex: none; }
  body.panning #vpEdit, body.panning #vpEdit * { cursor: grab !important; }
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; box-shadow: 0 2px 12px rgba(0,0,0,.14); background: #fff; }
  #host, #ov, #draw, #marks { position: absolute; inset: 0; }
  #ov, #marks { pointer-events: none; }
  #draw { width: 1280px; height: 720px; pointer-events: none; overflow: visible; }
  body.m-draw #draw { pointer-events: auto; cursor: crosshair; }
  body.m-draw.t-pin #draw { cursor: copy; }
  #host .rs-el[data-type="arrow"]::before, #host .rs-el[data-type="line"]::before { content: ""; position: absolute; inset: -7px; }
  body.m-edit #host .rs-el:hover { outline: 1px dashed rgba(169,31,36,.45); }
  body.m-pick #host .rs-el { cursor: pointer; }
  body.m-pick #host .rs-el:hover { outline: 2px solid rgba(229,72,77,.65); }
  .selbox { position: absolute; border: 2px solid var(--p); pointer-events: none; }
  .selbox.locked { border-style: dashed; }
  .selbox.pick { border-color: var(--mark); border-radius: 4px; }
  .hd { position: absolute; background: #fff; border: 2px solid var(--p); border-radius: 50%; pointer-events: auto; }
  .editor { position: absolute; background: rgba(255,255,255,.97); outline: 3px solid var(--p); white-space: pre-wrap; overflow: visible; z-index: 3; pointer-events: auto; padding: 2px; min-height: 20px; color: #1F1B1B; }
  #ov .chkbox { position: absolute; border: 2px dashed var(--err); background: rgba(186, 26, 26, .08); pointer-events: none; }
  /* 요청 표시(초안·대기·처리 중) */
  .mk { position: absolute; border: 2px solid var(--mark); border-radius: 4px; }
  .mk.open { border-color: #C98A00; border-style: dashed; }
  .mk.working { border-color: var(--info); border-style: dashed; }
  .mkn { position: absolute; width: 20px; height: 20px; border-radius: 50%; background: var(--mark); color: #fff; font: 700 11px/20px var(--font); text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.3); transform: translate(-50%, -50%); }
  .mkn.open { background: #C98A00; } .mkn.working { background: var(--info); }
  #draw path, #draw rect.dr { fill: none; stroke: var(--mark); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  #draw .open { stroke: #C98A00; stroke-dasharray: 6 4; }
  #draw .working { stroke: var(--info); stroke-dasharray: 6 4; }
  #draw circle.pin { fill: var(--mark); stroke: #fff; stroke-width: 2; }
  /* 메모 팝오버 */
  #memo { position: absolute; z-index: 20; width: 300px; background: #fff; border-radius: 14px; box-shadow: var(--sh2); padding: 10px; display: none; }
  #memo.show { display: block; }
  #memo .tt { font-size: 12px; color: var(--ink2); margin-bottom: 6px; display: flex; gap: 6px; align-items: center; }
  #memo textarea { width: 100%; min-height: 72px; border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; resize: vertical; font: 13px/1.5 var(--font); }
  #memo .quick { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }
  #memo .quick button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 2px 9px; font-size: 12px; }
  #memo .quick button:hover { background: var(--tone); }
  #memo .acts { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
  #memo .acts .mcnt { margin-right: auto; color: var(--ink2); font-size: 11px; }
  /* 보낼 요청 바 */
  #markbar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 15; display: none; align-items: center; gap: 10px; background: var(--ink); color: #fff; border-radius: 999px; padding: 6px 8px 6px 16px; box-shadow: var(--sh2); }
  #markbar.show { display: flex; }
  #markbar .chip { background: rgba(255,255,255,.14); color: #fff; }
  #markbar .chip.primary { background: var(--mark); }
  /* 떠 있는 서식 도구줄 */
  #ftb { align-self: center; z-index: 18; display: flex; visibility: hidden; align-items: center; gap: 1px; background: #fff; border-radius: 12px; box-shadow: var(--sh1); padding: 3px 6px; white-space: nowrap; min-height: 38px; max-width: 100%; overflow-x: auto; }
  #ftb.show { visibility: visible; }
  #ftb select { border: 1px solid var(--line); border-radius: 7px; padding: 3px 4px; background: #fff; max-width: 120px; }
  #ftb .num { width: 44px; border: 1px solid var(--line); border-radius: 7px; padding: 3px 4px; text-align: right; }
  #ftb .pt { font-size: 11px; color: var(--ink2); margin: 0 3px; min-width: 38px; }
  #ftb .sw { width: 18px; height: 18px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); display: inline-block; }
  #ftb .swl { font-size: 10px; color: var(--ink2); }
  .pal { display: grid; grid-template-columns: repeat(8, 22px); gap: 5px; padding: 4px 6px 6px; }
  .pal button { width: 22px; height: 22px; border-radius: 6px; border: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); padding: 0; }
  .pal button.on { outline: 2px solid var(--ink); outline-offset: 1px; }
  .pos { padding: 4px 6px; display: grid; gap: 6px; }
  .pos .r { display: flex; gap: 4px; align-items: center; }
  .pos input { width: 58px; border: 1px solid var(--line); border-radius: 7px; padding: 3px 5px; }
  .pos label { min-width: 26px; color: var(--ink2); font-size: 12px; white-space: nowrap; }
  /* PowerPoint 렌더 */
  #pngWrap { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 1280px; height: 720px; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  #pngWrap img { width: 100%; height: 100%; display: block; }
  #pngWrap .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; color: var(--ink2); background: var(--tone); }
  #pngPane { display: none; }
  body.preview #pngPane { display: flex; }
  #vpPng { overflow: hidden; }
  /* 아래 패널 + 바닥줄 */
  #bottom { margin: 8px 12px 0; background: var(--card); border-radius: 14px; display: flex; flex-direction: column; min-height: 0; }
  #bottom.fold .bpanel { display: none; }
  .bpanel { display: none; padding: 8px 12px 10px; overflow-y: auto; height: var(--bottomH, 140px); }
  .bpanel.on { display: block; }
  #notesTa { width: 100%; height: 100%; border: 0; background: var(--tone); border-radius: 10px; padding: 8px 12px; resize: none; font-family: var(--font); font-size: 14px; line-height: 1.6; }
  #outlineList div { padding: 3px 8px; border-radius: 8px; cursor: pointer; display: flex; gap: 8px; }
  #outlineList div:hover { background: var(--tone); }
  #outlineList div.on { background: var(--pc); }
  #outlineList .n { color: var(--ink2); width: 24px; text-align: right; flex: none; }
  #foot { display: flex; align-items: center; gap: 6px; padding: 6px 12px 8px; }
  #foot .tabs2 { display: flex; gap: 2px; }
  #foot .tabs2 button { border: 0; background: none; border-radius: 8px; padding: 4px 10px; color: var(--ink2); display: inline-flex; gap: 5px; align-items: center; }
  #foot .tabs2 button.on { background: var(--card); color: var(--ink); font-weight: 700; box-shadow: var(--sh1); }
  #foot .sp { flex: 1; }
  #slideCounter { min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
  #zoomSlider { width: 120px; }
  #zoomPct { min-width: 48px; }
  .cnt { background: var(--p); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; }
  /* ---------- 오른쪽 패널 ---------- */
  #right { background: var(--card); display: flex; flex-direction: column; min-height: 0; border-radius: 18px 0 0 0; overflow: hidden; }
  .tabs { display: flex; gap: 4px; padding: 10px 10px 6px; align-items: center; }
  .tabs .chip { flex: 1; justify-content: center; }
  .panel { flex: 1; overflow-y: auto; padding: 4px 12px 40px; display: none; }
  .panel.on { display: block; }
  .sec { background: var(--tone); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
  .sec h3 { margin: 0 0 8px; font-size: 12px; color: var(--ink2); font-weight: 700; }
  .row { display: flex; gap: 6px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  .row > label { width: 56px; color: var(--ink2); flex: none; }
  .row input[type=number] { width: 66px; }
  .row input, .row select, .sec textarea { border: 0; border-radius: 10px; background: #fff; padding: 5px 8px; }
  .row input[type=text] { flex: 1; min-width: 0; }
  .sec textarea { width: 100%; min-height: 90px; resize: vertical; font-family: Consolas, "Malgun Gothic", monospace; font-size: 12px; }
  .seg { display: inline-flex; background: #fff; border-radius: 999px; padding: 2px; }
  .seg button { border: 0; background: none; border-radius: 999px; padding: 3px 10px; }
  .seg button.on { background: var(--ink); color: #fff; }
  .sw { width: 16px; height: 16px; border-radius: 5px; display: inline-block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); flex: none; }
  .colorSel { flex: 1; min-width: 0; }
  .ellist { max-height: 220px; overflow-y: auto; }
  .ellist div { padding: 3px 8px; border-radius: 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ellist div:hover { background: #fff; }
  .ellist div.on { background: var(--pc); }
  .hint { color: var(--ink2); font-size: 12px; margin: 4px 0; }
  .req { background: var(--tone); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
  .req.done { opacity: .75; }
  .req .meta { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--ink2); margin-bottom: 4px; flex-wrap: wrap; }
  .req .st { border-radius: 999px; padding: 0 8px; font-weight: 700; }
  .req .st.draft { background: var(--mark); color: #fff; }
  .req .st.open { background: var(--warnc); color: var(--warn); }
  .req .st.done { background: var(--okc); color: var(--ok); }
  .req .st.working { background: var(--infoc); color: var(--info); }
  .req .txt { white-space: pre-wrap; }
  .req .reply { margin-top: 6px; background: #fff; border-radius: 10px; padding: 6px 10px; white-space: pre-wrap; }
  .req .reply b { color: var(--p); }
  .req .acts { display: flex; gap: 6px; margin-top: 6px; }
  .chk { background: var(--tone); border-radius: 12px; padding: 7px 10px; margin-bottom: 6px; cursor: pointer; }
  .chk:hover { background: var(--tone2); }
  .chk .sev { border-radius: 999px; padding: 0 8px; font-weight: 700; font-size: 11px; }
  .chk .sev.ERROR { background: var(--err); color: #fff; } .chk .sev.WARNING { background: var(--warnc); color: var(--warn); }
  .chk .rule { font-family: Consolas, monospace; font-size: 11px; color: var(--ink2); }
  .chk .msg { margin-top: 3px; white-space: pre-wrap; word-break: break-all; }
  .hist { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 10px; }
  .hist:hover { background: var(--tone); }
  .hist .k { font-size: 11px; border-radius: 999px; padding: 0 7px; background: var(--tone2); }
  .hist .k.build { background: var(--infoc); color: var(--info); }
  .hist .sp { flex: 1; }
  /* 발표 */
  #present { position: fixed; inset: 0; background: #000; z-index: 100; display: none; }
  #present.show { display: block; }
  #presentStage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; background: #fff; }
  #presentNotes { position: absolute; left: 0; right: 0; bottom: 0; max-height: 34vh; overflow-y: auto; background: rgba(20,20,20,.92); color: #eee; padding: 12px 20px; font-size: 16px; line-height: 1.6; display: none; white-space: pre-wrap; }
  #present.notes #presentNotes { display: block; }
  #presentInfo { position: absolute; right: 16px; top: 12px; color: #bbb; font: 13px Consolas, monospace; background: rgba(0,0,0,.5); border-radius: 8px; padding: 3px 8px; display: none; }
  #present.notes #presentInfo { display: block; }
  /* 기타 */
  #toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 18px; border-radius: 999px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 120; }
  #toast.show { opacity: .95; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp 0.8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  #help { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 110; display: none; align-items: center; justify-content: center; }
  #help.show { display: flex; }
  #help .box { background: #fff; border-radius: 18px; padding: 18px 22px; width: min(720px, 92vw); max-height: 84vh; overflow-y: auto; box-shadow: var(--sh2); }
  #help table { border-collapse: collapse; width: 100%; }
  #help td { padding: 4px 8px; border-bottom: 1px solid var(--tone2); vertical-align: top; }
  #help td:first-child { white-space: nowrap; width: 38%; }
</style>
</head>
<body class="m-edit">
<header>
  <button id="menuBtn" type="button"></button>
  <img class="logo" id="brandLogo" alt="" style="display:none">
  <h1 id="appTitle">nexa-slide</h1>
  <nav id="deckTabs" title="덱(장) — 누르면 바뀐다"></nav>
  <span class="sp"></span>
  <span id="status" class="chip sm">불러오는 중</span>
  <span id="sessChip" class="chip sm off" title="Claude Code 세션의 요청 감시 연결 상태"><span class="dot"></span>세션 확인 중</span>
  <button id="presentBtn" class="chip sm" title="발표 (F5 처음부터 · Shift+F5 현재 슬라이드부터) — 발표 중 N = 노트, Esc = 끝">▶ 발표</button>
  <button id="histBtn" class="chip sm" title="기록 — 저장할 때마다 남긴 자동 백업으로 되돌리기">기록</button>
  <a id="dl" class="chip sm" style="display:none" download>⬇ 받기</a>
  <button id="exportBtn" class="chip primary sm" title="내보내기 — PPTX · PowerPoint 렌더 미리보기">내보내기 ▾</button>
  <button id="moreBtn" class="ib" title="더보기 — 글꼴 세트·템플릿·단축키">⋯</button>
  <button id="rightBtn" class="ib" title="오른쪽 패널 접기/펴기 (Ctrl+\)">▤</button>
</header>
<main>
  <nav id="left"><div id="railSplit" title="끌어서 폭 조절 · 두 번 눌러 처음 폭"></div></nav>
  <section id="center">
    <div id="banner"><span id="bannerMsg"></span><span class="sp"></span>
      <button class="chip sm" id="bnTheirs">외부 버전 불러오기</button>
      <button class="chip sm primary" id="bnMine">내 편집으로 덮어쓰기</button></div>
    <div id="work">
      <div class="pane" id="editPane">
        <div id="subbar">
          <span id="modeSeg">
            <button data-mode="edit" title="편집 — 끌기·크기·글자 직접 수정 (E)">✎ 편집</button>
            <button data-mode="pick" title="선택 — 요소를 눌러 요청 메모를 단다 (M)">◎ 선택</button>
            <button data-mode="draw" title="그리기 — 영역을 표시해 요청 메모를 단다 (D)">✐ 그리기</button>
          </span>
          <span class="vsep"></span>
          <button class="ib" id="undoBtn" title="실행 취소 (Ctrl+Z)">↶</button>
          <button class="ib" id="redoBtn" title="다시 실행 (Ctrl+Y)">↷</button>
          <span id="drawTools">
            <span class="vsep"></span>
            <button class="ib on" data-tool="rect" title="박스 — 끌어서 영역">▭ 박스</button>
            <button class="ib" data-tool="pen" title="펜 — 자유 곡선">〰 펜</button>
            <button class="ib" data-tool="pin" title="핀 — 한 지점">📍 핀</button>
          </span>
          <span id="addTools">
            <span class="vsep"></span>
            <button class="ib" id="addBtn" title="요소 추가">＋ 추가 ▾</button>
          </span>
          <span class="vsep"></span>
          <button class="ib" id="chkBtn" title="레이아웃 검사 결과(아래 검사 탭)">⚠ 검사 <span class="cnt" id="chkCnt" style="display:none"></span></button>
          <button class="ib" id="aiFixBtn" title="이 슬라이드의 검사 결과(겹침·넘침·글자 크기)를 세션에 고쳐 달라고 바로 요청 — 기존 디자인 유지">✨ 레이아웃 고치기</button>
          <button class="ib" id="aiPolishBtn" title="기존 스타일을 유지하며 내용 논리·배치를 다듬어 달라고 세션에 바로 요청">✨ 다듬기</button>
          <span class="hint2" id="modeHint"></span>
        </div>
        <div id="ftb"></div>
        <div class="viewport" id="vpEdit">
          <div id="stageWrap"><div id="stage"><div id="host"></div><div id="marks"></div><svg id="draw" viewBox="0 0 1280 720"></svg><div id="ov"></div></div></div>
        </div>
        <div id="memo"><div class="tt"><b id="memoTitle">요청</b><span id="memoTarget"></span></div>
          <textarea id="memoTa" maxlength="2000" placeholder="무엇을 바꿀까요? (Enter = 추가, Shift+Enter = 줄바꿈)"></textarea>
          <div class="quick" id="memoQuick"></div>
          <div class="acts"><span class="mcnt" id="memoCnt">0 / 2000</span><button class="chip sm" id="memoCancel">취소</button><button class="chip sm primary" id="memoOk" disabled>추가</button></div></div>
        <div id="markbar"><span id="markMsg">보낼 요청</span><button class="chip sm" id="markDiscard" title="이 슬라이드에 메모가 있으면 그 슬라이드만, 없으면 전체를 지운다">취소</button><button class="chip sm primary" id="markSend">보내기</button></div>
      </div>
      <div class="pane" id="pngPane"><div class="cap">PowerPoint 렌더 <span id="pngInfo"></span><button class="chip sm" id="renderBtn">다시 렌더</button></div>
        <div class="viewport" id="vpPng"><div id="pngWrap"></div></div></div>
    </div>
    <div id="bottom">
      <div class="bpanel on" id="bp-notes"><textarea id="notesTa" placeholder="이 슬라이드의 발표자 노트 — PPTX 슬라이드 노트로 들어간다"></textarea></div>
      <div class="bpanel" id="bp-outline"><div id="outlineList"></div></div>
      <div class="bpanel" id="bp-check"></div>
    </div>
    <div id="foot">
      <span class="tabs2" id="bTabs">
        <button data-b="notes" class="on" title="발표자 노트">노트 <span class="hint" id="notesInfo" style="margin:0"></span></button>
        <button data-b="outline" title="개요 — 슬라이드 제목 목록">개요</button>
        <button data-b="check" title="레이아웃 검사 — 저장할 때마다 자동">검사 <span class="cnt" id="chkCnt2" style="display:none"></span></button>
        <button id="bFold" title="아래 패널 접기/펴기">▾</button>
      </span>
      <span class="sp"></span>
      <button class="ib" id="prevBtn" title="이전 슬라이드 (PageUp)">◀</button>
      <span id="slideCounter">- / -</span>
      <button class="ib" id="nextBtn" title="다음 슬라이드 (PageDown)">▶</button>
      <span class="sp"></span>
      <button class="ib" id="zoomOut" title="축소 (Ctrl+-)">−</button>
      <input type="range" id="zoomSlider" min="10" max="300" step="1" title="확대 (Ctrl+휠)">
      <button class="ib" id="zoomIn" title="확대 (Ctrl+=)">＋</button>
      <button class="ib" id="zoomPct" title="100% 로">100%</button>
      <button class="ib" id="zoomFit" title="화면 맞춤 (Ctrl+0)">⤢ 맞춤</button>
    </div>
  </section>
  <aside id="right">
    <div class="tabs">
      <button class="chip on" data-tab="props">속성</button>
      <button class="chip" data-tab="reqs">요청 <span class="cnt" id="reqCnt" style="display:none"></span></button>
      <button class="chip" data-tab="hist">기록</button>
    </div>
    <div class="panel on" id="tab-props"></div>
    <div class="panel" id="tab-reqs"></div>
    <div class="panel" id="tab-hist"></div>
  </aside>
</main>
<div id="present"><div id="presentStage"></div><div id="presentInfo"></div><div id="presentNotes"></div></div>
<div id="help"><div class="box"></div></div>
<div id="toast"></div>
<script src="render.js"></script>
<script src="studio.js"></script>
</body>
</html>
